<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>财务女生自律成长工作台</title>
<style>
:root{
  --bg:#f7f5f1; --bg-soft:#fffdf9; --bg-card:#ffffff;
  --text:#2c2c2c; --text-secondary:#6b6b6b; --text-light:#9a9a9a;
  --accent:#6b8e7f; --accent-deep:#4a6b5c; --accent-soft:#e8efe9;
  --gold:#c4a882; --gold-soft:#f0e6d6;
  --border:#e5e0d8; --radius:12px; --radius-sm:8px;
  --shadow:0 1px 3px rgba(0,0,0,0.04),0 4px 12px rgba(0,0,0,0.03);
  --font:'-apple-system','PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;}
.app{display:flex;min-height:100vh;}
/* 左侧菜单 */
.sidebar{width:210px;flex-shrink:0;background:var(--bg-soft);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:10;}
.sidebar-header{padding:24px 20px 20px;border-bottom:1px solid var(--border);}
.sidebar-header h1{font-size:15px;font-weight:600;color:var(--accent-deep);letter-spacing:.5px;line-height:1.4;}
.sidebar-header .sub{font-size:11px;color:var(--text-light);margin-top:4px;}
.menu{flex:1;overflow-y:auto;padding:10px 0;}
.menu-item{display:flex;align-items:center;padding:11px 20px;cursor:pointer;color:var(--text-secondary);font-size:13px;transition:all .2s;border-left:3px solid transparent;gap:10px;}
.menu-item:hover{background:var(--accent-soft);color:var(--accent-deep);}
.menu-item.active{background:var(--accent-soft);color:var(--accent-deep);font-weight:600;border-left-color:var(--accent);}
.menu-item .num{font-size:10px;color:var(--text-light);width:18px;text-align:center;flex-shrink:0;}
.menu-item.active .num{color:var(--accent);}
.sidebar-footer{padding:12px 20px;border-top:1px solid var(--border);font-size:10px;color:var(--text-light);text-align:center;}
/* 右侧内容 */
.main{flex:1;margin-left:210px;padding:32px 40px;max-width:920px;}
.panel{display:none;}
.panel.active{display:block;animation:fade .3s ease;}
@keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.panel-title{font-size:20px;font-weight:600;color:var(--text);margin-bottom:4px;}
.panel-desc{font-size:12px;color:var(--text-light);margin-bottom:24px;}
/* 通用卡片 */
.card{background:var(--bg-card);border-radius:var(--radius);padding:20px 24px;box-shadow:var(--shadow);margin-bottom:16px;border:1px solid var(--border);}
.card-title{font-size:13px;font-weight:600;color:var(--accent-deep);margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.card-title .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);}
/* 进度条 */
.progress-wrap{background:var(--bg);border-radius:20px;height:6px;overflow:hidden;margin-top:6px;}
.progress-fill{height:100%;background:var(--accent);border-radius:20px;transition:width .4s;}
.progress-label{font-size:11px;color:var(--text-light);margin-top:4px;}
/* Todo */
.todo-item{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);cursor:pointer;transition:all .15s;}
.todo-item:last-child{border-bottom:none;}
.todo-item:hover{padding-left:4px;}
.todo-checkbox{width:18px;height:18px;border-radius:4px;border:2px solid var(--border);flex-shrink:0;margin-top:1px;transition:all .2s;cursor:pointer;}
.todo-checkbox.checked{background:var(--accent);border-color:var(--accent);position:relative;}
.todo-checkbox.checked::after{content:'';position:absolute;left:4px;top:1px;width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg);}
.todo-item.done .todo-text{text-decoration:line-through;color:var(--text-light);}
.todo-content{flex:1;}
.todo-text{font-size:13px;line-height:1.5;}
.todo-tag{display:inline-block;font-size:10px;padding:1px 8px;border-radius:10px;margin-top:4px;}
.tag-video{background:rgba(180,100,100,.1);color:#a06060;}
.tag-study{background:rgba(100,100,160,.1);color:#6868a0;}
.tag-english{background:rgba(200,130,60,.12);color:#b07830;}
.tag-exercise{background:rgba(80,150,100,.12);color:#4a8a5a;}
.tag-hot{background:rgba(180,100,100,.1);color:#a06060;}
/* 选题卡片 */
.topic-card{background:var(--bg-card);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);margin-bottom:12px;border:1px solid var(--border);border-left:3px solid var(--accent);transition:all .2s;}
.topic-card:hover{border-left-color:var(--gold);transform:translateX(2px);}
.topic-cat{font-size:10px;padding:2px 8px;border-radius:8px;font-weight:600;display:inline-block;margin-bottom:6px;}
.cat-tax{background:var(--accent-soft);color:var(--accent-deep);}
.cat-hot{background:rgba(180,100,100,.1);color:#a06060;}
.cat-exam{background:rgba(100,100,160,.1);color:#6868a0;}
.cat-growth{background:var(--gold-soft);color:#9b7d5a;}
.topic-title{font-size:14px;font-weight:600;line-height:1.5;margin-bottom:6px;}
.topic-desc{font-size:12px;color:var(--text-secondary);line-height:1.6;}
.topic-meta{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
.topic-badge{font-size:10px;padding:2px 7px;border-radius:8px;background:var(--bg);color:var(--text-secondary);}
.copy-block{margin-top:10px;padding:10px 12px;background:var(--bg);border-radius:var(--radius-sm);border-left:2px solid var(--gold);}
.copy-label{font-size:10px;font-weight:600;color:var(--gold);margin-bottom:4px;letter-spacing:.5px;}
.copy-text{font-size:12px;line-height:1.6;color:var(--text-secondary);}
.copy-text strong{color:var(--text);}
/* 脚本卡片 */
.script-card{background:var(--bg-card);border-radius:var(--radius);padding:20px 24px;box-shadow:var(--shadow);margin-bottom:16px;border:1px solid var(--border);}
.script-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--border);}
.script-title{font-size:14px;font-weight:600;color:var(--accent-deep);}
.script-tag{font-size:10px;padding:2px 8px;border-radius:8px;background:var(--gold-soft);color:#9b7d5a;}
.script-section{margin-bottom:14px;}
.script-section-title{font-size:11px;font-weight:600;color:var(--accent);margin-bottom:6px;letter-spacing:.5px;}
.script-section-content{font-size:12px;line-height:1.7;color:var(--text-secondary);}
.shot-table{width:100%;border-collapse:collapse;font-size:11px;}
.shot-table th{text-align:left;padding:6px 8px;background:var(--bg);color:var(--text-light);font-weight:600;border-bottom:1px solid var(--border);font-size:10px;}
.shot-table td{padding:8px;border-bottom:1px solid var(--border);vertical-align:top;line-height:1.5;}
.shot-table td:first-child{white-space:nowrap;color:var(--accent);font-weight:600;}
/* 复盘 */
.review-field{margin-bottom:16px;}
.review-field label{display:block;font-size:12px;font-weight:600;color:var(--accent-deep);margin-bottom:6px;}
.review-field textarea{width:100%;min-height:80px;padding:12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-family:var(--font);font-size:13px;resize:vertical;background:var(--bg-soft);color:var(--text);line-height:1.6;}
.review-field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
/* 女性故事 */
.woman-card{margin-bottom:16px;}
.woman-name{font-size:16px;font-weight:600;color:var(--accent-deep);}
.woman-title{font-size:12px;color:var(--gold);margin-bottom:10px;}
.woman-story{font-size:13px;line-height:1.8;color:var(--text-secondary);}
.woman-quote{margin-top:14px;padding:12px 16px;background:var(--gold-soft);border-radius:var(--radius-sm);font-size:13px;color:var(--text);font-style:italic;border-left:3px solid var(--gold);}
.thought-input{margin-top:14px;width:100%;min-height:60px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-family:var(--font);font-size:12px;resize:vertical;background:var(--bg-soft);}
.thought-input:focus{outline:none;border-color:var(--accent);}
/* 会计备考 */
.exam-countdown{text-align:center;padding:20px;background:var(--accent-soft);border-radius:var(--radius);margin-bottom:16px;}
.exam-countdown .days{font-size:42px;font-weight:700;color:var(--accent-deep);line-height:1;}
.exam-countdown .label{font-size:12px;color:var(--text-secondary);margin-top:6px;}
.phase-tabs{display:flex;gap:8px;margin-bottom:16px;}
.phase-tab{flex:1;padding:10px;text-align:center;border-radius:var(--radius-sm);font-size:12px;cursor:pointer;border:1px solid var(--border);background:var(--bg-soft);transition:all .2s;}
.phase-tab.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.phase-tab .phase-sub{font-size:10px;color:var(--text-light);margin-top:2px;}
.phase-tab.active .phase-sub{color:rgba(255,255,255,.7);}
.chapter-task{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
.chapter-task:last-child{border-bottom:none;}
.chapter-dot{width:8px;height:8px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;margin-top:4px;cursor:pointer;transition:all .2s;}
.chapter-dot.done{background:var(--accent);border-color:var(--accent);}
.chapter-content{flex:1;}
.chapter-name{font-size:13px;font-weight:500;}
.chapter-points{font-size:11px;color:var(--text-light);margin-top:2px;}
.study-log{display:flex;gap:10px;margin-top:14px;}
.study-log input{flex:1;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:12px;}
.study-log button{padding:8px 16px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);font-size:12px;cursor:pointer;white-space:nowrap;}
.study-log button:hover{background:var(--accent-deep);}
/* 英语 */
.english-card{text-align:center;padding:28px 24px;}
.english-sentence{font-size:20px;font-weight:500;color:var(--text);line-height:1.5;margin-bottom:6px;}
.english-translation{font-size:13px;color:var(--text-secondary);margin-bottom:16px;}
.english-words{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:16px;}
.english-word{font-size:11px;padding:3px 10px;border-radius:10px;background:var(--gold-soft);color:#9b7d5a;}
.tts-btn{padding:10px 24px;background:var(--accent);color:#fff;border:none;border-radius:20px;font-size:13px;cursor:pointer;transition:all .2s;}
.tts-btn:hover{background:var(--accent-deep);}
.tts-btn:disabled{opacity:.5;cursor:default;}
.english-count{font-size:11px;color:var(--text-light);margin-top:14px;}
.checkin-btn{padding:8px 20px;border:1px solid var(--accent);color:var(--accent-deep);background:transparent;border-radius:20px;font-size:12px;cursor:pointer;transition:all .2s;margin-top:10px;}
.checkin-btn:hover{background:var(--accent);color:#fff;}
.checkin-btn.done{background:var(--accent);color:#fff;}
/* 运动 */
.sport-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.sport-card{background:var(--bg-card);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);border:1px solid var(--border);}
.sport-name{font-size:14px;font-weight:600;color:var(--accent-deep);margin-bottom:8px;}
.sport-link{display:block;font-size:11px;color:var(--accent);text-decoration:none;margin-bottom:6px;padding:6px 10px;background:var(--bg);border-radius:var(--radius-sm);transition:all .15s;}
.sport-link:hover{background:var(--accent-soft);}
.sport-weekly{margin-top:12px;}
.weekly-dots{display:flex;gap:6px;margin-top:6px;}
.weekly-dot{width:24px;height:24px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--text-light);cursor:pointer;transition:all .2s;}
.weekly-dot.done{background:var(--accent);border-color:var(--accent);color:#fff;}
.weekly-dot.today{border-color:var(--gold);}
/* 统计 */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;}
.stat-card{background:var(--bg-card);border-radius:var(--radius);padding:16px;text-align:center;box-shadow:var(--shadow);border:1px solid var(--border);}
.stat-value{font-size:24px;font-weight:700;color:var(--accent-deep);}
.stat-label{font-size:11px;color:var(--text-light);margin-top:4px;}
.stat-rate{font-size:10px;margin-top:6px;padding:2px 8px;border-radius:8px;display:inline-block;}
.rate-high{background:var(--accent-soft);color:var(--accent-deep);}
.rate-mid{background:var(--gold-soft);color:#9b7d5a;}
.rate-low{background:rgba(180,100,100,.1);color:#a06060;}
.streak-banner{background:var(--accent-soft);border-radius:var(--radius);padding:16px 20px;margin-bottom:16px;display:flex;align-items:center;gap:16px;}
.streak-number{font-size:32px;font-weight:700;color:var(--accent-deep);}
.streak-text{flex:1;}
.streak-label{font-size:13px;font-weight:600;color:var(--text);}
.streak-sub{font-size:11px;color:var(--text-secondary);margin-top:2px;}
.streak-warn{display:none;padding:10px 14px;background:rgba(180,100,100,.08);border-radius:var(--radius-sm);font-size:12px;color:#a06060;margin-bottom:12px;}
.streak-warn.show{display:block;}
.monthly-bar-item{margin-bottom:10px;}
.monthly-bar-label{font-size:12px;color:var(--text-secondary);margin-bottom:4px;display:flex;justify-content:space-between;}
.monthly-bar-track{background:var(--bg);border-radius:20px;height:8px;overflow:hidden;}
.monthly-bar-fill{height:100%;border-radius:20px;transition:width .4s;}
.bar-study{background:var(--accent);}
.bar-english{background:var(--gold);}
.bar-sport{background:#4a8a5a;}
.bar-review{background:#6868a0;}
.bar-todo{background:#a06060;}
.history-table{width:100%;border-collapse:collapse;font-size:12px;}
.history-table th{text-align:left;padding:8px;background:var(--bg);color:var(--text-light);font-weight:600;border-bottom:1px solid var(--border);font-size:11px;}
.history-table td{padding:8px;border-bottom:1px solid var(--border);}
.history-table tr.today-row{background:var(--accent-soft);}
.cell-yes{color:var(--accent);font-weight:600;}
.cell-no{color:var(--text-light);}
/* 博客 */
.blog-card{background:var(--bg-card);border-radius:var(--radius);padding:16px 20px;box-shadow:var(--shadow);margin-bottom:12px;border:1px solid var(--border);transition:all .2s;}
.blog-card:hover{border-color:var(--accent);}
.blog-source{font-size:10px;color:var(--gold);margin-bottom:4px;}
.blog-title{font-size:13px;font-weight:600;line-height:1.5;margin-bottom:4px;}
.blog-summary{font-size:12px;color:var(--text-secondary);line-height:1.6;}
/* 通用按钮 */
.btn{padding:8px 16px;border-radius:var(--radius-sm);font-size:12px;cursor:pointer;transition:all .2s;border:none;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{background:var(--accent-deep);}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text-secondary);}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent-deep);}
/* 灵感备忘 */
.memo-area{width:100%;min-height:100px;padding:12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-family:var(--font);font-size:12px;resize:vertical;background:var(--bg-soft);line-height:1.6;}
.memo-area:focus{outline:none;border-color:var(--accent);}
.section-divider{height:1px;background:var(--border);margin:20px 0;}
.hidden{display:none;}
/* 响应式 */
@media(max-width:768px){
  .sidebar{position:relative;width:100%;height:auto;flex-direction:row;overflow-x:auto;}
  .sidebar-header,.sidebar-footer{display:none;}
  .menu{flex-direction:row;padding:0;}
  .menu-item{white-space:nowrap;border-left:none;border-bottom:3px solid transparent;}
  .menu-item.active{border-bottom-color:var(--accent);}
  .main{margin-left:0;padding:20px;}
  .stats-grid{grid-template-columns:repeat(2,1fr);}
  .sport-grid{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="sidebar-header">
      <h1>财务女生<br>自律成长工作台</h1>
      <div class="sub" id="todayDate"></div>
    </div>
    <div class="menu" id="menuList"></div>
    <div class="sidebar-footer">每日零点自动刷新</div>
  </div>
  <div class="main" id="mainContent"></div>
</div>

<script>
/* ============================================================
   财务女生自律成长工作台 — 全新重构
   ============================================================ */

/* ========== 工具函数 ========== */
function getTodayStr(){
  var d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function dateSeed(offset){
  var d=new Date(); d.setDate(d.getDate()+(offset||0));
  return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();
}
function seededRand(seed){
  var x=Math.sin(seed)*10000; return x-Math.floor(x);
}
function pickFromArray(arr,n,seedOffset){
  var pool=arr.slice(), result=[], seed=dateSeed(seedOffset||0);
  for(var i=0;i<n&&pool.length>0;i++){
    var idx=Math.floor(seededRand(seed+i*7.3)*pool.length);
    result.push(pool.splice(idx,1)[0]);
  }
  return result;
}
function lsGet(key){ try{return localStorage.getItem(key);}catch(e){return null;} }
function lsSet(key,val){ try{localStorage.setItem(key,val);}catch(e){} }
function debounce(fn,wait){
  var t; return function(){var a=arguments,c=this;clearTimeout(t);t=setTimeout(function(){fn.apply(c,a);},wait);};
}

/* ========== 菜单定义 ========== */
var MENU=[
  {id:'plan',name:'每日核心计划'},
  {id:'media',name:'财税自媒体创作库'},
  {id:'review',name:'每日复盘日记'},
  {id:'women',name:'伟大女性故事打卡'},
  {id:'accounting',name:'中级会计单科备考'},
  {id:'english',name:'日常口语英语打卡'},
  {id:'sport',name:'运动打卡专区'},
  {id:'stats',name:'打卡数据统计总览'},
  {id:'blog',name:'财经博客精选推送'}
];

var currentPanel='plan';

function renderMenu(){
  var c=document.getElementById('menuList');
  c.innerHTML='';
  MENU.forEach(function(m,i){
    var el=document.createElement('div');
    el.className='menu-item'+(m.id===currentPanel?' active':'');
    el.innerHTML='<span class="num">'+(i+1)+'</span><span>'+m.name+'</span>';
    el.onclick=function(){switchPanel(m.id);};
    c.appendChild(el);
  });
}

function switchPanel(id){
  currentPanel=id;
  renderMenu();
  renderPanel(id);
}

function renderPanel(id){
  var main=document.getElementById('mainContent');
  main.innerHTML='';
  switch(id){
    case 'plan': renderPlan(main); break;
    case 'media': renderMedia(main); break;
    case 'review': renderReview(main); break;
    case 'women': renderWomen(main); break;
    case 'accounting': renderAccounting(main); break;
    case 'english': renderEnglish(main); break;
    case 'sport': renderSport(main); break;
    case 'stats': renderStats(main); break;
    case 'blog': renderBlog(main); break;
  }
}

/* ========== 面板1: 每日核心计划 ========== */
var TODO_DEFS=[
  {text:'查看当日自媒体热点、整理选题素材',tag:'hot'},
  {text:'完成当日短视频拍摄或更新',tag:'video'},
  {text:'中级会计单科当日学习+刷题打卡',tag:'study'},
  {text:'日常英语口语+词汇音频跟读打卡',tag:'english'},
  {text:'本周运动打卡跟进',tag:'exercise'}
];
var TODO_LABELS={hot:'热点',video:'自媒体',study:'备考',english:'英语',exercise:'运动'};

function renderPlan(main){
  var today=getTodayStr();
  var key='fw_'+today+'_todos';
  var stored=lsGet(key);
  var todos;
  if(stored){ try{todos=JSON.parse(stored);}catch(e){todos=generateTodos();} }
  else{ todos=generateTodos(); lsSet(key,JSON.stringify(todos)); }

  var done=todos.filter(function(t){return t.done;}).length;
  var pct=todos.length>0?Math.round(done/todos.length*100):0;

  var html='<div class="panel-title">每日核心计划</div>'+
    '<div class="panel-desc">极简5项 · 自媒体 + 备考 + 英语 + 运动</div>'+
    '<div class="card">'+
      '<div class="card-title"><span class="dot"></span>今日进度 '+done+'/'+todos.length+'</div>'+
      '<div class="progress-wrap"><div class="progress-fill" style="width:'+pct+'%"></div></div>'+
      '<div class="progress-label">完成率 '+pct+'%</div>'+
      '<div style="margin-top:12px;" id="todoList"></div>'+
    '</div>';
  main.innerHTML=html;

  var list=document.getElementById('todoList');
  todos.forEach(function(todo,idx){
    var item=document.createElement('div');
    item.className='todo-item'+(todo.done?' done':'');
    item.innerHTML='<div class="todo-checkbox'+(todo.done?' checked':'')+'"></div>'+
      '<div class="todo-content"><div class="todo-text">'+todo.text+'</div>'+
      '<span class="todo-tag tag-'+todo.tag+'">'+TODO_LABELS[todo.tag]+'</span></div>';
    item.onclick=function(){
      todos[idx].done=!todos[idx].done;
      lsSet(key,JSON.stringify(todos));
      renderPlan(main);
    };
    list.appendChild(item);
  });
}

function generateTodos(){
  return TODO_DEFS.map(function(t){return{text:t.text,tag:t.tag,done:false};});
}

function renderMedia(main){

    '<div class="panel-desc">每日4条选题 + 4版文案 + 2套完整拍摄脚本</div>';

  /* 选题 */
  var tax=pickFromArray(TOPIC_POOL.filter(function(t){return t.cat==='tax';}),1,1);
  var hot=pickFromArray(TOPIC_POOL.filter(function(t){return t.cat==='hot';}),1,101);
  var exam=pickFromArray(TOPIC_POOL.filter(function(t){return t.cat==='exam';}),1,201);
  var growth=pickFromArray(TOPIC_POOL.filter(function(t){return t.cat==='growth';}),1,301);
  var topics=[].concat(tax).concat(hot).concat(exam).concat(growth);
  var catLabels={tax:'财税',hot:'热点',exam:'备考',growth:'女生成长'};
  var catNames=['干货','共情','吐槽','Vlog'];

  html+='<div class="card"><div class="card-title"><span class="dot"></span>今日4条选题（四大赛道混搭）</div>';
  topics.forEach(function(t,i){
    html+='<div class="topic-card" style="margin-bottom:14px;">';
    html+='<span class="topic-cat cat-'+t.cat+'">'+catLabels[t.cat]+'</span>';
    html+='<div class="topic-title">'+(i+1)+'. '+t.title+'</div>';
    html+='<div class="topic-desc">'+t.desc+'</div>';
    html+='<div class="topic-meta">';
    t.tags.forEach(function(tg){html+='<span class="topic-badge">'+tg+'</span>';});
    html+='</div>';
    /* 4版标题文案 */
    t.titles.forEach(function(tt,j){
      html+='<div class="copy-block"><div class="copy-label">'+catNames[j]+'版 · 标题+开头</div><div class="copy-text"><strong>'+tt+'</strong></div></div>';
    });
    html+='</div>';
  });
  html+='</div>';

  /* 拍摄脚本 */
  var scripts=pickFromArray(SCRIPT_POOL,2,501);
  html+='<div class="card"><div class="card-title"><span class="dot"></span>今日2套完整拍摄脚本</div>';
  scripts.forEach(function(s,i){
    html+='<div class="script-card">';

    html+='<div class="script-section"><div class="script-section-title">分镜表</div>';
    html+='<table class="shot-table"><tr><th>时间</th><th>镜头动作</th><th>拍摄要点</th></tr>';
    s.shots.forEach(function(sh){
      html+='<tr><td>'+sh.scene+'</td><td>'+sh.action+'</td><td>'+sh.detail+'</td></tr>';
    });
    html+='</table></div>';
    html+='<div class="script-section"><div class="script-section-title">BGM建议</div><div class="script-section-content">'+s.bgm+'</div></div>';
    html+='<div class="script-section"><div class="script-section-title">结尾互动话术</div><div class="script-section-content">'+s.cta+'</div></div>';
    html+='<div class="script-section"><div class="script-section-title">对标参考</div><div class="script-section-content">'+s.benchmark+'</div></div>';

  });
  html+='</div>';

  /* 灵感备忘录 */
  var memoKey='fw_'+getTodayStr()+'_memo';
  html+='<div class="card"><div class="card-title"><span class="dot"></span>灵感备忘录 / 二创素材记录</div>'+

function renderReview(main){
  var today=getTodayStr();
  var key='fw_'+today+'_review';
  var data=lsGet(key);
  var review={gain:'',lack:'',optimize:''};
  if(data){ try{review=JSON.parse(data);}catch(e){} }

  main.innerHTML='<div class="panel-title">每日复盘日记</div>'+
    '<div class="panel-desc">今日收获 · 今日不足 · 明日优化</div>'+
    '<div class="card">'+
      '<div class="review-field"><label>今日收获</label><textarea id="rvGain" placeholder="今天做成了什么？学到了什么？">'+review.gain+'</textarea></div>'+
      '<div class="review-field"><label>今日不足</label><textarea id="rvLack" placeholder="哪里可以做得更好？">'+review.lack+'</textarea></div>'+
      '<div class="review-field"><label>明日优化方向</label><textarea id="rvOpt" placeholder="明天要重点改进什么？">'+review.optimize+'</textarea></div>'+
      '<button class="btn btn-primary" id="rvSave">保存复盘</button> <span id="rvSaved" style="font-size:11px;color:var(--accent);margin-left:8px;"></span>'+
    '</div>';

  document.getElementById('rvSave').onclick=function(){
    var d={gain:document.getElementById('rvGain').value,lack:document.getElementById('rvLack').value,optimize:document.getElementById('rvOpt').value};
    lsSet(key,JSON.stringify(d));
    var el=document.getElementById('rvSaved');
    el.textContent='已保存 ✓';
    setTimeout(function(){el.textContent='';},2000);
  };
}

  {name:'居里夫人',title:'两届诺贝尔奖得主 · 放射性研究先驱',story:'玛丽·居里是历史上第一位获得诺贝尔奖的女性，也是唯一一位在两个不同科学领域（物理和化学）获奖的人。在巴黎求学时，她住在简陋的阁楼里，常常靠面包和茶度日，冬天水都会结冰。但她从未放弃对科学的热爱。与丈夫皮埃尔·居里一起，她在漏风的棚屋里用数吨沥青铀矿提炼出仅仅0.1克镭。她的坚持不仅改变了科学史，更证明了女性在科学领域同样可以站上巅峰。即使面对丈夫意外离世的巨大打击，她依然接过了他的教鞭，成为巴黎大学第一位女教授。',quote:'生活中没有什么可怕的东西，只有需要理解的东西。'},
  {name:'屠呦呦',title:'诺贝尔生理学或医学奖得主 · 青蒿素之母',story:'屠呦呦是中国本土培养的科学家，因发现青蒿素——一种有效治疗疟疾的药物——而获得2015年诺贝尔生理学或医学奖。在文革期间的艰苦条件下，她带领团队查阅了大量中国古代医学典籍，从葛洪的《肘后备急方》中获得灵感，经历了190次失败后终于提取出青蒿素。为了验证安全性，她甚至以身试药。这一发现拯救了全球数百万疟疾患者的生命，尤其是非洲儿童。她用一生证明了：科学不需要华丽的实验室，需要的是不放弃的信念。',quote:'青蒿素是中医药给世界的一份礼物。'},
  {name:'张桂梅',title:'华坪女子高中创办者 · 大山里的灯塔',story:'张桂梅在云南华坪县创办了全国第一所全免费女子高中——华坪女子高级中学。她身患多种疾病，却坚持每天5点起床，12点后才休息，用全部精力托举大山里的女孩走出贫困。12年间，她把1804名女孩送进了大学。她说："一个女孩走出去，改变的是三代人的命运。"她没有自己的孩子，却成了上千个女孩的"张妈妈"。她用瘦弱的身体扛起了整座大山的教育希望，证明了教育的力量可以改变命运。',quote:'我生来就是高山而非溪流，我欲于群峰之巅俯视平庸的沟壑。'},
  {name:'可可·香奈儿',title:'时尚革命家 · 香奈儿品牌创始人',story:'可可·香奈儿出身贫寒，在孤儿院长大。她从一家小帽子店起步，凭借敏锐的直觉和不服输的性格，彻底改变了女性的穿衣方式。她解放了女性从束身衣中，推出了小黑裙、香奈儿套装、5号香水等经典。在那个男性主导的时代，她用自己的才华证明：女性不仅可以穿得自由，更可以活得自由。她一生都在工作，直到88岁去世前还在筹备下一场时装秀。她说过："时尚会过时，只有风格永存。"',quote:'想要成为无可替代的人，就必须与众不同。'},
  {name:'弗洛伦斯·南丁格尔',title:'现代护理学之母 · 统计学先驱',story:'南丁格尔出身英国上流社会，却毅然选择当时被视为"底层工作"的护理职业。在克里米亚战争中，她带领38名护士奔赴前线，发现英军士兵死于疾病的数量是死于战伤的10倍。她用统计学方法分析死亡原因，用玫瑰图直观展示数据，成功说服军方改善卫生条件，将死亡率从42%降到2%。她不仅是一位伟大的护士，更是一位用数据改变世界的先驱。战后她创办了第一所正规护理学校，奠定了现代护理学的基础。',quote:'我从不找借口，也不接受借口。'},
  {name:'何泽慧',title:'中国核物理之父钱三强的妻子与合作者 · 中国的居里夫人',story:'何泽慧是中国第一代核物理学家，在德国获得弹道学博士学位后，赴法国居里实验室工作。她与丈夫钱三强一起发现了铀核三分裂和四分裂现象，被西方媒体称为"中国的居里夫人"。回国后，她参与了中国核物理研究的开创工作，在极其简陋的条件下坚持科研。她一生淡泊名利，住在中关村的老房子里，直到晚年仍然骑自行车去研究所。她用一生证明：真正的科学家不需要光环，只需要对真理的热爱。',quote:'一个科学家应该对祖国和人民有所贡献。'},
  {name:'奥黛丽·赫本',title:'奥斯卡影后 · 联合国儿童基金会大使',story:'奥黛丽·赫本不仅在银幕上留下了《罗马假日》《蒂凡尼的早餐》等经典，更在晚年将全部精力投入联合国儿童基金会的人道主义工作。二战期间，她在荷兰经历饥荒，联合国救济救了她的命。成名后她决定回报这份恩情。她多次深入非洲、亚洲的贫困地区和战区，为饥饿中的儿童奔走呼吁。即使身患癌症，她依然完成了最后一次索马里之行。她用自己的影响力让世界关注最脆弱的儿童，用行动诠释了什么是真正的美——不是外表，而是善良。',quote:'想拥有迷人的双唇，请说善意的言语。'},
  {name:'林徽因',title:'中国第一位女建筑师 · 诗人',story:'林徽因是中国现代建筑学的开拓者之一，与丈夫梁思成一起走遍中国15个省、190多个县，考察测绘了2738处古建筑。在战火纷飞的年代，她拖着病体在荒野中爬上爬下测量古建筑，为保护中国建筑遗产做出了不可磨灭的贡献。她参与设计了国徽和人民英雄纪念碑，同时还是一位才华横溢的诗人和作家。她证明了女性可以在科学和艺术两个领域同时闪耀，不必在理性与感性之间做选择。',quote:'你是一树一树的花开，是燕在梁间呢喃。'},
  {name:'鲁斯·巴德·金斯伯格',title:'美国最高法院大法官 · 性别平等斗士',story:'金斯伯格是美国历史上第二位女性最高法院大法官。她在哈佛法学院时，院长问她"如何解释你们占据了一个本应属于男性的法学院名额"。她以全班第一的成绩毕业，却因性别原因找不到律所工作。但她没有放弃，转而投身 ACLU 女权项目，通过一个个具体案件推动性别平等法律改革。她论证的不只是女性受歧视，也代理男性因性别遭受不公的案件，证明性别歧视伤害所有人。80多岁时她成了流行文化偶像，被年轻人称为"声名狼藉的 RBG"。',quote:'女性要成为自己人生决策的主导者。'},
  {name:'谢丽尔·桑德伯格',title:'Facebook COO · 《向前一步》作者',story:'谢丽尔·桑德伯格是硅谷最有影响力的女性高管之一。她在谷歌从零搭建广告团队，后加入 Facebook 担任首席运营官，帮助公司从初创走向上市。2013年她出版《向前一步》，鼓励女性不要在有机会之前就自我设限，勇敢地坐到桌前来。丈夫意外去世后，她公开分享自己的悲痛和恢复过程，写下了《Option B》，帮助无数经历逆境的人。她用行动证明：女性领导力不是模仿男性，而是带着同理心和韧性去领导。',quote:'完成比完美更重要。'},
  {name:'屠洪娇',title:'中国首位女航天员刘洋的老师 · 航天教育推动者',story:'（以刘洋为原型）刘洋是中国第一位进入太空的女航天员。2012年，她乘坐神舟九号飞船进入太空，完成了中国首次载人交会对接任务。在训练中，她经历了与男性航天员同样严酷的考验：离心机8G过载、72小时狭小环境剥夺睡眠、水下失重训练。她用实力证明：在探索宇宙这件事上，性别从来不是限制。太空没有性别之分，只有准备充分与否之分。她激励了无数中国女孩仰望星空，相信梦想没有边界。',quote:'太空不会因为你是女性就对你温柔以待，但它会因为你的准备而向你敞开。'},
  {name:'阿达·洛芙莱斯',title:'世界第一位程序员 · 数学先驱',story:'阿达·洛芙莱斯是英国数学家，被公认为世界上第一位计算机程序员。在100多年前的1843年，她为查尔斯·巴贝奇的分析机编写了第一个算法——一个计算伯努利数的程序。她甚至预见了计算机不仅能做计算，还能创作音乐和艺术——这个远见直到100年后才被验证。在那个女性不被允许接受高等教育的时代，她靠自学和家庭教师学习数学。她的父亲是诗人拜伦，但她选择了理性而非浪漫，用数学之美书写了自己的人生。',quote:'我的大脑绝不仅仅是凡人之物，它必将探索未知的领域。'},
  {name:'董明珠',title:'格力电器董事长 · 中国商界铁娘子',story:'董明珠36岁时丈夫去世，她独自带着儿子从南京南下珠海，从一名普通销售员做起。她用"盯死客户"的笨办法，跑遍安徽市场，创下个人销售额3650万的纪录。凭借铁腕和魄力，她一路升到格力电器的掌门人。她坚持自主技术创新，拒绝做代工贴牌，把格力打造成全球空调行业龙头。她的管理风格强硬到被叫"铁娘子"，但她坚信：对质量的妥协就是对消费者的欺骗。她证明了：女性不仅能在商界生存，更能引领行业。',quote:'对自己狠一点，逼自己努力，再过五年你将会感谢今天发狠的自己。'},
  {name:'杨绛',title:'文学翻译家 · 《我们仨》作者',story:'杨绛是著名作家、文学翻译家，也是钱钟书的妻子。她通晓多国语言，翻译了《堂吉诃德》等经典作品。在特殊年代，她被下放干校劳动，却依然保持从容。晚年，女儿和丈夫相继去世后，她以92岁高龄开始写作《我们仨》，记录一家三口的温暖岁月。她活到105岁，在生命的最后阶段仍在整理钱钟书的遗稿。她的一生诠释了什么叫"优雅地老去"——不是外表的光鲜，而是内心的丰盈和对生活的深情。',quote:'我们曾如此渴望命运的波澜，到最后才发现：人生最曼妙的风景，竟是内心的淡定与从容。'},
  {name:'吴健雄',title:'东方居里夫人 · 实验物理学家',story:'吴健雄是中国裔美国物理学家，被誉为"东方居里夫人"和"核物理女王"。她设计了验证宇称不守恒理论的实验，这个实验直接帮助杨振宁和李振宁获得诺贝尔物理学奖——但她本人却未能分享这一荣誉。尽管如此，她从未抱怨，继续在实验物理领域做出卓越贡献。她是美国物理学会第一位女性会长，在男性绝对主导的物理学界，用精密的实验技术赢得了所有人的尊重。她证明了：荣誉不是目的，追求真理本身才是。',quote:'不要因为别人不相信你，就怀疑自己。实验结果是最有力的回答。'},
  {name:'安妮·弗兰克',title:'《安妮日记》作者 · 大屠杀见证者',story:'安妮·弗兰克是一个犹太女孩，二战期间与家人躲在阿姆斯特丹一间密室中长达两年。在这段暗无天日的日子里，13岁的她用日记记录了自己的恐惧、希望、成长和对世界的思考。她在日记中展现出的文学天赋和对人性的深刻洞察，远超她的年龄。最终，她和家人被发现并送往集中营，安妮在 Bergen-Belsen 集中营去世，年仅15岁。但她的日记留存了下来，被翻译成60多种语言，成为20世纪最重要的文学作品之一。她用稚嫩的笔触证明了：即使在最黑暗的地方，精神也可以发光。',quote:'我仍然相信人心的善良。'},
  {name:'马拉拉·优素福扎伊',title:'最年轻的诺贝尔和平奖得主 · 教育权益活动家',story:'马拉拉是巴基斯坦女孩，在塔利班控制地区为女孩的受教育权发声。11岁时她开始为 BBC 写匿名博客，记录塔利班统治下的生活。2012年，15岁的她在校车上被塔利班枪击头部，奇迹般生还。康复后她没有沉默，反而更加坚定地为全球女童教育奔走。17岁时她获得诺贝尔和平奖，成为最年轻的诺贝尔奖得主。她用生命证明：一个人的声音或许微弱，但当它代表正义时，子弹也无法让它沉默。',quote:'一个孩子、一位教师、一支笔和一本书可以改变世界。'},
  {name:'邓稼先夫人许鹿希',title:'隐忍坚守28年的科学家的妻子',story:'1958年，邓稼先告诉妻子许鹿希："我要调动工作了，不能告诉你去哪里，也不能告诉你做什么。"从此，许鹿希独自抚养两个孩子，等待了整整28年。这28年里，她不知道丈夫在哪里、在做什么、是否安全。直到1986年，邓稼先因核辐射导致癌症晚期被接回北京，两人才重逢。28天的相聚后，邓稼先离世。许鹿希用余生整理丈夫的遗稿，出版了他的传记。她没有站上领奖台，但她是台后最坚实的支撑。她的故事告诉我们：伟大事业的背后，总有默默守护的人。',quote:'我等你28年，不是因为我不苦，是因为我知道你在做一件更重要的事。'},
  {name:'玛丽亚·梅耶',title:'诺贝尔物理学奖得主 · 原子核壳模型提出者',story:'玛丽亚·梅耶是德裔美国物理学家，提出了原子核壳层模型，解释了原子核中"幻数"现象。在约翰·霍普金斯大学和芝加哥大学期间，她长期以"志愿助理教授"身份工作——因为当时的反裙带关系政策不允许夫妻同校任职。她没有正式薪水，却做出了诺贝尔奖级别的成果。1963年，她成为历史上第二位女性诺贝尔物理学奖得主。她用行动证明：头衔和薪水不能定义一个人的价值，真正的科学家只为求知而工作。',quote:'做物理是一种乐趣，如果你太在意回报，你就感受不到这种乐趣。'},
  {name:'弗吉尼亚·伍尔夫',title:'意识流文学先驱 · 女性主义思想先驱',story:'弗吉尼亚·伍尔夫是20世纪最重要的现代主义作家之一。她在《一间自己的房间》中提出了著名论断："一个女人要想写小说，必须有钱和一间自己的房间。"这句话成为女性独立的宣言。她患有严重的心理健康问题，但从未停止创作，《达洛维夫人》《到灯塔去》等作品开创了意识流文学的新纪元。她不仅是一位文学革命者，更是一位思想先驱——她让世界看到：女性的内心世界同样丰富、复杂、值得被书写。',quote:'一个人能使自己成为自己，比什么都重要。'},
  {name:'简·古道尔',title:'动物行为学家 · 黑猩猩研究先驱',story:'简·古道尔26岁时前往坦桑尼亚贡贝溪国家公园，开始在野外观察黑猩猩。她没有大学学历，只有对动物的热爱和惊人的耐心。她花了数月时间让黑猩猩接受她的存在，最终发现了黑猩猩会制造和使用工具——这一发现颠覆了"只有人类会制造工具"的定论。她的导师路易斯·利基说："现在我们要么重新定义工具，要么重新定义人类，要么接受黑猩猩也是人类。"她后来转型为环保活动家，每年300天在全球奔走，呼吁保护自然。',quote:'每个人都很重要，每个人都能发挥作用，每个人都能带来变化。'},
  {name:'王亚平',title:'中国首位太空授课教师 · 女航天员',story:'王亚平是中国第二批航天员，2013年乘坐神舟十号进入太空，成为继刘洋之后第二位进入太空的中国女性。她在太空中进行了中国首次太空授课，向全国6000万学生直播演示了失重条件下的物理现象。2021年，她再次执行神舟十三号任务，成为中国首位出舱活动的女航天员，并在太空驻留183天，创造了中国航天员在轨驻留时长纪录。她从山东农村走出，用坚持和实力证明：仰望星空的权利不分性别。',quote:'太空不会区分性别，它只奖赏有准备的人。'},
  {name:'梅耶·马斯克',title:'模特 · 营养学博士 · 三个亿万富翁的母亲',story:'梅耶·马斯克在31岁时成为单亲妈妈，独自抚养三个孩子。她同时打五份工，做营养师咨询、当模特、教课，生活艰辛却从不放弃自我成长。她在42岁时搬到加拿大重新开始，在50多岁时重返模特行业，69岁成为 CoverGirl 代言人，71岁登上时代广场广告牌。她的儿子埃隆·马斯克成为世界首富，但她从不依附于儿子的光环，始终保持独立的事业和生活。她证明了：女性的精彩人生没有年龄上限，任何时候重新开始都不晚。',quote:'你不需要一个完美的开始，你只需要开始。'},
  {name:'秋瑾',title:'中国女权和女学思想的倡导者 · 革命先驱',story:'秋瑾是中国近代革命家和女权运动先驱。她冲破封建婚姻的束缚，东渡日本留学，结识了鲁迅、徐锡麟等革命志士。她创办了《中国女报》，倡导女性解放，提出"女学不兴，种族不强"的主张。1907年，她策划安庆起义失败后被捕，面对审讯她写下"秋风秋雨愁煞人"七个字，从容就义，年仅32岁。她是中国历史上第一位为革命牺牲的女性，用生命为女性解放和民族复兴开辟了道路。',quote:'身不得，男儿列；心却比，男儿烈。'},
  {name:'罗莎·帕克斯',title:'民权运动之母 · 不向不公低头',story:'1955年12月1日，在阿拉巴马州蒙哥马利市的一辆公交车上，42岁的黑人女裁缝罗莎·帕克斯拒绝给白人乘客让座，因此被捕。这个看似简单的"不"字，点燃了美国民权运动的燎原之火。她的被捕引发了长达381天的蒙哥马利公交车抵制运动，最终导致公交种族隔离制度被废除。她说："我不是因为累了才不让座，我累了是因为我受够了。"她用行动证明：改变世界不一定需要权力和地位，有时候只需要勇气说"不"。',quote:'我唯一疲倦的，是屈服。'},
  {name:'珍·奥斯汀',title:'英国文学巨匠 · 《傲慢与偏见》作者',story:'简·奥斯汀生活在18世纪末的英国，那个时代女性写作被认为"不体面"。她的所有作品都是在客厅里偷偷写的，有人来就把手稿藏起来。她终身未婚，靠微薄的收入生活，41岁去世时几乎无人知晓她的作家身份。但她留下的六部小说——《傲慢与偏见》《理智与情感》等——成为英语文学的经典。她用细腻的笔触描绘了女性的困境、智慧和尊严，证明了：真正的才华不会因为被忽视而消失，它只是需要时间被世界发现。',quote:'我不会让贫穷折损我的浪漫，但也不会让浪漫蒙蔽我对现实的判断。'},
  {name:'屠呦呦',title:'诺贝尔奖得主 · 从古籍中找到抗疟药方',story:'（补充篇）屠呦呦在寻找抗疟药物时，试验了数百种中药提取物，全部失败。就在她几乎要放弃时，她在东晋葛洪的《肘后备急方》中读到一句话："青蒿一握，以水二升渍，绞取汁，尽服之。"这句1600年前的古方给了她灵感——也许高温破坏了青蒿的有效成分。她改用低温提取，终于在第191次实验中成功。这一发现拯救了数百万人的生命。她的故事告诉我们：创新不是凭空而来，它站在传统和坚持的肩膀上。',quote:'青蒿素是中医药给世界的一份礼物，也是坚持给科学的一份答案。'},
  {name:'海伦·凯勒',title:'作家 · 演说家 · 在黑暗中找到光明',story:'海伦·凯勒在19个月大时因病失去了视力和听力，陷入了一个无声无光的世界。在老师安妮·沙利文的帮助下，她学会了通过触觉"阅读"和"说话"——用手感受别人嘴唇的 movement 和喉咙的振动。她成为第一位获得文学学士学位的盲聋人，精通多种语言，一生写了14本书。她不仅是一位作家，更是一位社会活动家，为残障人士权益奔走呼吁。她证明了：真正的障碍不在身体，而在是否有人愿意帮你打开一扇窗。',quote:'世界上最美好和最美好的东西是看不见也摸不到的，它们只能用心去感受。'},
  {name:'吴仪',title:'中国铁娘子 · 前国务院副总理',story:'吴仪是中国改革开放后最重要的女性政治家之一。她从石油战线技术员做起，凭借出色的能力一步步走到国务院副总理的位置。在2003年非典危机中，她临危受命出任卫生部部长，以果断和透明的方式控制了疫情。在中美经贸谈判中，她以犀利和专业著称，被外媒称为"中国铁娘子"。她终身未婚，把全部精力投入到工作中。她说过："我自己没有家庭，但全国人民就是我的家人。"她证明了：女性从政不需要柔弱标签，专业和魄力才是最好的名片。',quote:'我从不在乎别人怎么评价我，我在乎的是我做了什么。'},
  {name:'屠哟哟',title:'（拓展）坚持190次失败后的成功',story:'当屠呦呦第190次失败时，很多人劝她放弃。但她翻开古籍，发现一个被所有人忽略的细节：古方说"绞取汁"，而不是"煎煮"。这意味着高温可能破坏了有效成分。她立刻改变提取方法，用乙醚低温萃取。第191次实验成功了。这个改变世界的灵感，来自一本1600年前的旧书和一颗不肯放弃的心。她的故事告诉我们：失败不是终点，放弃才是。而转机往往藏在最不起眼的细节里。',quote:'成功的反面不是失败，而是不去尝试。'},
  {name:'张纯如',title:'作家 · 《南京暴行》作者 · 真相的守护者',story:'张纯如是一位美籍华裔作家和记者。她在研究中发现了被西方世界遗忘的南京大屠杀历史，决心让这段真相被世界知道。她花了三年时间走访幸存者、查阅档案，于1997年出版了《南京暴行：被遗忘的大屠杀》。这本书登上《纽约时报》畅销书榜，让西方世界第一次大规模关注这一历史事件。然而，面对不断接触残酷史料带来的精神创伤和某些势力的威胁，她的心理健康严重恶化。2004年，她结束了自己36岁的生命。她用生命守护了真相，也提醒我们：记住历史，是对死者最大的尊重。',quote:'如果你忘了历史，历史就会重演。文字是武器，真相是力量。'},
  {name:'波什·赖斯',title:'首位非裔美国女性国务卿 · 国家安全顾问',story:'康多莉扎·赖斯在美国种族隔离的南方长大。小时候，她父亲告诉她："你可能吃不了这家餐厅，但你可以成为美国总统。"她没有成为总统，但成为了美国历史上第一位非裔女性国务卿。她是苏联问题专家，15岁进入大学，26岁获得博士学位，后成为斯坦福大学教授和教务长。在布什政府中，她先后担任国家安全顾问和国务卿，是美国最有权力的女性之一。她证明了：出身和肤色不是限制，教育和准备才是通行证。',quote:'当你被低估时，最好的回应是用实力说话。'}
];

function renderAccounting(main){
  var today=getTodayStr();
  var examDate=new Date(EXAM_DATE);
  var now=new Date();
  var days=Math.ceil((examDate-now)/(1000*60*60*24));

  /* 统计完成进度 */
  var totalDone=0,totalChap=STUDY_CHAPTERS.length;
  STUDY_CHAPTERS.forEach(function(c){
    if(lsGet('fw_chapter_done_'+c.name)) totalDone++;
  });

  main.innerHTML='<div class="panel-title">中级会计实务 · 单科备考</div>'+
    '<div class="panel-desc">分阶段学习 · 章节打卡 · 断卡补学</div>'+
    '<div class="exam-countdown"><div class="days">'+days+'</div><div class="label">距2026年9月5日考试</div></div>'+
    '<div class="card">'+
      '<div class="card-title"><span class="dot"></span>总体进度 '+totalDone+'/'+totalChap+' 章</div>'+
      '<div class="progress-wrap"><div class="progress-fill" style="width:'+Math.round(totalDone/totalChap*100)+'%"></div></div>'+
      '<div class="progress-label">'+Math.round(totalDone/totalChap*100)+'%</div>'+
    '</div>'+
    '<div class="phase-tabs" id="phaseTabs"></div>'+
    '<div class="card" id="chapterCard"></div>'+
    '<div class="card">'+
      '<div class="card-title"><span class="dot"></span>今日学习时长打卡</div>';
  var logKey='fw_'+today+'_study_log';
  var logVal=lsGet(logKey)||'';
  main.innerHTML+='当前记录：<span id="studyLogDisplay" style="font-size:13px;font-weight:600;color:var(--accent-deep);">'+(logVal||'未记录')+'</span>'+
    '<div class="study-log"><input type="number" id="studyHours" placeholder="学习小时数，如2.5" min="0" step="0.5"><button id="logStudyBtn">记录</button></div>'+
    '</div>';

  /* 渲染阶段tabs */
  var tabsEl=document.getElementById('phaseTabs');
  PHASES.forEach(function(p){
    var tab=document.createElement('div');
    tab.className='phase-tab'+(p.id===currentPhase?' active':'');
    tab.innerHTML=p.name+'<div class="phase-sub">'+p.sub+'</div>';
    tab.onclick=function(){currentPhase=p.id;renderAccounting(main);};
    tabsEl.appendChild(tab);
  });

  /* 渲染章节任务 */
  var phase=PHASES.find(function(p){return p.id===currentPhase;});
  var chapEl=document.getElementById('chapterCard');
  chapEl.innerHTML='<div class="card-title"><span class="dot"></span>'+phase.name+'章节任务</div>';
  var chapters=STUDY_CHAPTERS.slice(phase.range[0],phase.range[1]);
  chapters.forEach(function(c){
    var done=lsGet('fw_chapter_done_'+c.name);
    var item=document.createElement('div');
    item.className='chapter-task';
    item.innerHTML='<div class="chapter-dot'+(done?' done':'')+'"></div>'+
      '<div class="chapter-content"><div class="chapter-name">'+c.name+'</div>'+
      '<div class="chapter-points">核心考点：'+c.points+'</div></div>';
    item.onclick=function(){
      if(done){lsSet('fw_chapter_done_'+c.name,'');}else{lsSet('fw_chapter_done_'+c.name,'1');}
      renderAccounting(main);
    };
    chapEl.appendChild(item);
  });

  /* 学习时长记录 */
  document.getElementById('logStudyBtn').onclick=function(){
    var h=parseFloat(document.getElementById('studyHours').value);
    if(h>0){
      lsSet(logKey,String(h));
      var el=document.getElementById('studyLogDisplay');
      el.textContent=h+' 小时';
      document.getElementById('studyHours').value='';
    }
  };
}

/* ========== 面板8: 打卡数据统计总览 ========== */
function calcStreak(keySuffix){
  var streak=0;
  for(var i=0;i<365;i++){
    var d=new Date(); d.setDate(d.getDate()-i);
    var ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    if(lsGet('fw_'+ds+'_'+keySuffix)) streak++; else break;
  }
  return streak;
}
function calcYesterdayCount(){
  var items=['study','english','sport','review'];
  var count=0;
  var d=new Date(); d.setDate(d.getDate()-1);
  var ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  items.forEach(function(it){
    if(lsGet('fw_'+ds+'_'+it+'_done')||lsGet('fw_'+ds+'_'+it)) count++;
  });
  /* review 特殊：检查有内容 */
  if(lsGet('fw_'+ds+'_review')) count++;
  return count;
}
function calcMonthRate(keySuffix){
  var now=new Date();
  var ym=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  var done=0;
  for(var j=1;j<=now.getDate();j++){
    var ds=ym+'-'+String(j).padStart(2,'0');
    if(lsGet('fw_'+ds+'_'+keySuffix)) done++;
  }
  return {done:done,total:now.getDate(),pct:Math.round(done/now.getDate()*100)};
}

function renderStats(main){
  var today=getTodayStr();
  var now=new Date();

  /* 计算各项数据 */
  var studyStreak=calcStreak('study_done');
  var enStreak=calcStreak('english_done');
  var sportStreak=calcStreak('sport_done');
  /* review: 有内容的算打卡 */
  var reviewStreak=0;
  for(var i=0;i<365;i++){
    var d=new Date(); d.setDate(d.getDate()-i);
    var ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    if(lsGet('fw_'+ds+'_review')) reviewStreak++; else break;
  }

  var studyRate=calcMonthRate('study_done');
  var enRate=calcMonthRate('english_done');
  var sportRate=calcMonthRate('sport_done');
  var reviewRate={done:0,total:now.getDate(),pct:0};
  var ym=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  for(var j=1;j<=now.getDate();j++){
    var ds=ym+'-'+String(j).padStart(2,'0');
    if(lsGet('fw_'+ds+'_review')) reviewRate.done++;
  }
  reviewRate.pct=Math.round(reviewRate.done/reviewRate.total*100);

  /* todo 完成率 */
  var todoRate={done:0,total:0,pct:0};
  for(var j=1;j<=now.getDate();j++){
    var ds=ym+'-'+String(j).padStart(2,'0');
    var td=lsGet('fw_'+ds+'_todos');
    if(td){ try{ var arr=JSON.parse(td); todoRate.total++; if(arr.filter(function(t){return t.done;}).length===arr.length) todoRate.done++; }catch(e){} }
  }
  todoRate.pct=todoRate.total>0?Math.round(todoRate.done/todoRate.total*100):0;

  /* 断卡检测 */
  var yesterdayCount=calcYesterdayCount();
  var broken=yesterdayCount<3;

  /* 最长连续 */
  var maxStreak=Math.max(studyStreak,enStreak,sportStreak,reviewStreak);

  /* 历史记录（近14天） */
  var history=[];
  for(var i=13;i>=0;i--){
    var d=new Date(); d.setDate(d.getDate()-i);
    var ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    var rec={date:ds,study:!!lsGet('fw_'+ds+'_study_done'),english:!!lsGet('fw_'+ds+'_english_done'),sport:!!lsGet('fw_'+ds+'_sport_done'),review:!!lsGet('fw_'+ds+'_review')};
    var td=lsGet('fw_'+ds+'_todos');
    if(td){ try{var arr=JSON.parse(td);rec.todo=Math.round(arr.filter(function(t){return t.done;}).length/arr.length*100);}catch(e){rec.todo=0;} }
    else{rec.todo=null;}
    history.push(rec);
  }

  function rateClass(pct){return pct>=80?'rate-high':pct>=50?'rate-mid':'rate-low';}

  var html='<div class="panel-title">打卡数据统计总览</div>'+
    '<div class="panel-desc">连续打卡 · 完成率 · 断卡提醒 · 历史记录</div>';

  /* 断卡提醒 */
  if(broken){
    html+='<div class="streak-warn show">⚠ 昨日仅完成'+yesterdayCount+'/4项打卡，今日加油！</div>';
  }

  /* 连续天数横幅 */
  html+='<div class="streak-banner">'+
    '<div class="streak-number">'+maxStreak+'</div>'+
    '<div class="streak-text"><div class="streak-label">最长连续打卡天数</div>'+
    '<div class="streak-sub">备考'+studyStreak+'天 · 英语'+enStreak+'天 · 运动'+sportStreak+'天 · 复盘'+reviewStreak+'天</div></div>'+
    '</div>';

  /* 四项卡片 */
  html+='<div class="stats-grid">'+
    '<div class="stat-card"><div class="stat-value">'+studyStreak+'</div><div class="stat-label">备考连续天数</div><div class="stat-rate '+rateClass(studyRate.pct)+'">月完成率 '+studyRate.pct+'%</div></div>'+
    '<div class="stat-card"><div class="stat-value">'+enStreak+'</div><div class="stat-label">英语连续天数</div><div class="stat-rate '+rateClass(enRate.pct)+'">月完成率 '+enRate.pct+'%</div></div>'+
    '<div class="stat-card"><div class="stat-value">'+sportStreak+'</div><div class="stat-label">运动连续天数</div><div class="stat-rate '+rateClass(sportRate.pct)+'">月完成率 '+sportRate.pct+'%</div></div>'+
    '<div class="stat-card"><div class="stat-value">'+reviewStreak+'</div><div class="stat-label">复盘连续天数</div><div class="stat-rate '+rateClass(reviewRate.pct)+'">月完成率 '+reviewRate.pct+'%</div></div>'+
    '</div>';

  /* 月度进度条 */
  html+='<div class="card"><div class="card-title"><span class="dot"></span>月度完成进度</div>';
  var bars=[
    {label:'中级会计备考',pct:studyRate.pct,cls:'bar-study'},
    {label:'英语跟读',pct:enRate.pct,cls:'bar-english'},
    {label:'运动打卡',pct:sportRate.pct,cls:'bar-sport'},
    {label:'复盘日记',pct:reviewRate.pct,cls:'bar-review'},
    {label:'每日计划全完成',pct:todoRate.pct,cls:'bar-todo'}
  ];
  bars.forEach(function(b){
    html+='<div class="monthly-bar-item"><div class="monthly-bar-label"><span>'+b.label+'</span><span>'+b.pct+'%</span></div><div class="monthly-bar-track"><div class="monthly-bar-fill '+b.cls+'" style="width:'+b.pct+'%"></div></div></div>';
  });
  html+='</div>';

  /* 历史记录表 */
  html+='<div class="card"><div class="card-title"><span class="dot"></span>近14天打卡历史</div>'+
    '<div style="overflow-x:auto;"><table class="history-table"><tr><th>日期</th><th>备考</th><th>英语</th><th>运动</th><th>复盘</th><th>计划</th></tr>';
  history.forEach(function(h){
    var isToday=h.date===today;
    html+='<tr'+(isToday?' class="today-row"':'')+'>'+
      '<td>'+h.date.slice(5)+'</td>'+
      '<td class="'+(h.study?'cell-yes':'cell-no')+'">'+(h.study?'✓':'—')+'</td>'+
      '<td class="'+(h.english?'cell-yes':'cell-no')+'">'+(h.english?'✓':'—')+'</td>'+
      '<td class="'+(h.sport?'cell-yes':'cell-no')+'">'+(h.sport?'✓':'—')+'</td>'+
      '<td class="'+(h.review?'cell-yes':'cell-no')+'">'+(h.review?'✓':'—')+'</td>'+
      '<td>'+(h.todo!==null?h.todo+'%':'—')+'</td>'+
      '</tr>';
  });
  html+='</table></div></div>';

  main.innerHTML=html;
}

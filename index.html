<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>清新每一天 · 2026财务成长工作台</title>
<style>
:root{
  --bg:#f5f7f4;--bg-soft:#fefdfa;--bg-card:#ffffff;
  --text:#2c2c2c;--text-2:#6b6b6b;--text-3:#a0a0a0;
  --green:#7baa8e;--green-deep:#4a7c5e;--green-soft:#e4efe7;
  --apricot:#d4a574;--apricot-soft:#f5ebe0;
  --cream:#f0ebe2;--border:#e5e0d8;--radius:14px;--radius-sm:8px;
  --shadow:0 1px 4px rgba(0,0,0,.04),0 6px 16px rgba(0,0,0,.03);
  --font:'-apple-system','PingFang SC','Microsoft YaHei',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
.app{display:flex;min-height:100vh}
/* 侧栏 */
.sidebar{width:210px;flex-shrink:0;background:var(--bg-soft);border-right:1px solid var(--border);position:fixed;top:0;left:0;bottom:0;z-index:10;display:flex;flex-direction:column}
.sidebar-hd{padding:22px 18px 16px;border-bottom:1px solid var(--border)}
.sidebar-hd h1{font-size:14px;font-weight:700;color:var(--green-deep);letter-spacing:.3px;line-height:1.4}
.sidebar-hd .sub{font-size:10px;color:var(--text-3);margin-top:4px}
.menu{flex:1;overflow-y:auto;padding:8px 0}
.menu-item{display:flex;align-items:center;gap:8px;padding:10px 18px;cursor:pointer;color:var(--text-2);font-size:12.5px;transition:all .15s;border-left:3px solid transparent}
.menu-item:hover{background:var(--green-soft);color:var(--green-deep)}
.menu-item.active{background:var(--green-soft);color:var(--green-deep);font-weight:600;border-left-color:var(--green)}
.menu-item .mi-num{font-size:9px;color:var(--text-3);width:16px;text-align:center;flex-shrink:0}
.menu-item.active .mi-num{color:var(--green)}
.sidebar-ft{padding:10px 18px;border-top:1px solid var(--border);font-size:9px;color:var(--text-3);text-align:center}
/* 主区 */
.main{flex:1;margin-left:210px;padding:28px 36px;max-width:960px}
.panel{display:none}.panel.active{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.pt{font-size:19px;font-weight:700;color:var(--text);margin-bottom:3px}
.pd{font-size:11.5px;color:var(--text-3);margin-bottom:22px}
/* 卡片 */
.card{background:var(--bg-card);border-radius:var(--radius);padding:18px 22px;box-shadow:var(--shadow);margin-bottom:14px;border:1px solid var(--border)}
.card-t{font-size:12.5px;font-weight:600;color:var(--green-deep);margin-bottom:10px;display:flex;align-items:center;gap:7px}
.card-t .dot{width:5px;height:5px;border-radius:50%;background:var(--green)}
/* 进度条 */
.pw{background:var(--bg);border-radius:20px;height:6px;overflow:hidden}
.pf{height:100%;background:var(--green);border-radius:20px;transition:width .4s}
.pl{font-size:10.5px;color:var(--text-3);margin-top:3px}
/* 按钮 */
.btn{padding:6px 14px;border-radius:var(--radius-sm);font-size:11.5px;cursor:pointer;transition:all .15s;border:none;white-space:nowrap}
.btn-g{background:var(--green);color:#fff}.btn-g:hover{background:var(--green-deep)}
.btn-o{background:transparent;border:1px solid var(--border);color:var(--text-2)}.btn-o:hover{border-color:var(--green);color:var(--green-deep)}
.btn-s{background:var(--green-soft);color:var(--green-deep)}.btn-s:hover{background:var(--green);color:#fff}
.btn-mini{padding:3px 10px;font-size:10.5px;border-radius:6px;cursor:pointer;transition:all .15s;border:none}
.btn-mini.copy{background:var(--green-soft);color:var(--green-deep)}.btn-mini.copy:hover{background:var(--green);color:#fff}
.btn-mini.fav{background:var(--apricot-soft);color:#b07830}.btn-mini.fav:hover{background:var(--apricot);color:#fff}
.btn-mini.fav.active{background:var(--apricot);color:#fff}
.btn-mini.link{background:var(--cream);color:var(--text-2)}.btn-mini.link:hover{background:var(--green-soft);color:var(--green-deep)}
/* Todo */
.todo-item{display:flex;align-items:flex-start;gap:11px;padding:11px 0;border-bottom:1px solid var(--border);cursor:pointer;transition:all .12s}
.todo-item:last-child{border-bottom:none}
.todo-item:hover{padding-left:3px}
.todo-cb{width:17px;height:17px;border-radius:4px;border:2px solid var(--border);flex-shrink:0;margin-top:1px;transition:all .15s;cursor:pointer}
.todo-cb.checked{background:var(--green);border-color:var(--green);position:relative}
.todo-cb.checked::after{content:'';position:absolute;left:3px;top:0;width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.todo-item.done .todo-tx{text-decoration:line-through;color:var(--text-3)}
.todo-ct{flex:1}.todo-tx{font-size:13px;line-height:1.5}
.tag{display:inline-block;font-size:9.5px;padding:1px 7px;border-radius:8px;margin-top:3px}
.tg-hot{background:rgba(180,100,100,.1);color:#a06060}.tg-video{background:rgba(180,100,100,.08);color:#a06060}
.tg-study{background:rgba(100,100,160,.1);color:#6868a0}.tg-english{background:rgba(200,130,60,.1);color:#b07830}.tg-exercise{background:rgba(80,150,100,.1);color:#4a8a5a}
/* 首页快捷入口 */
.dash-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.dash-card{background:var(--bg-card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);border:1px solid var(--border);cursor:pointer;transition:all .2s;text-align:center}
.dash-card:hover{border-color:var(--green);transform:translateY(-2px);box-shadow:0 4px 16px rgba(123,170,142,.15)}
.dash-icon{font-size:24px;margin-bottom:6px}
.dash-name{font-size:12px;font-weight:600;color:var(--text)}
.dash-desc{font-size:10px;color:var(--text-3);margin-top:2px}
/* 爆款榜 */
.rank-list{list-style:none}
.rank-item{display:flex;align-items:flex-start;gap:12px;padding:14px 0;border-bottom:1px solid var(--border)}
.rank-item:last-child{border-bottom:none}
.rank-num{width:24px;height:24px;border-radius:50%;background:var(--green-soft);color:var(--green-deep);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rank-item:nth-child(1) .rank-num{background:var(--apricot);color:#fff}
.rank-item:nth-child(2) .rank-num{background:var(--green);color:#fff}
.rank-item:nth-child(3) .rank-num{background:#b07830;color:#fff}
.rank-body{flex:1;min-width:0}
.rank-title{font-size:13px;font-weight:600;line-height:1.5}
.rank-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;align-items:center}
.rank-badge{font-size:9px;padding:2px 7px;border-radius:6px;background:var(--cream);color:var(--text-2)}
.rank-badge.tax{background:var(--green-soft);color:var(--green-deep)}
.rank-badge.hot{background:rgba(180,100,100,.08);color:#a06060}
.rank-badge.exam{background:rgba(100,100,160,.08);color:#6868a0}
.rank-badge.growth{background:var(--apricot-soft);color:#b07830}
.rank-score{font-size:11px;font-weight:700;color:var(--apricot)}
.rank-reason{font-size:11.5px;color:var(--text-2);margin-top:5px;line-height:1.5}
.rank-reason strong{color:var(--text)}
.rank-actions{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap}
/* 分页tab */
.sub-tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.sub-tab{padding:7px 14px;border-radius:var(--radius-sm);font-size:12px;cursor:pointer;border:1px solid var(--border);background:var(--bg-soft);color:var(--text-2);transition:all .15s}
.sub-tab.active{background:var(--green);color:#fff;border-color:var(--green)}
.sub-tab:hover:not(.active){border-color:var(--green);color:var(--green-deep)}
/* 选题卡 */
.topic-card{background:var(--bg-card);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);margin-bottom:10px;border:1px solid var(--border);border-left:3px solid var(--green);transition:all .15s}
.topic-card:hover{border-left-color:var(--apricot);transform:translateX(2px)}
.tc-cat{font-size:9px;padding:2px 7px;border-radius:6px;font-weight:600;display:inline-block;margin-bottom:5px}
.tc-cat.tax{background:var(--green-soft);color:var(--green-deep)}.tc-cat.hot{background:rgba(180,100,100,.08);color:#a06060}.tc-cat.exam{background:rgba(100,100,160,.08);color:#6868a0}.tc-cat.growth{background:var(--apricot-soft);color:#b07830}
.tc-title{font-size:13px;font-weight:600;line-height:1.5;margin-bottom:5px}
.tc-desc{font-size:11.5px;color:var(--text-2);line-height:1.6}
.tc-meta{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap;align-items:center}
.tc-badge{font-size:9px;padding:2px 6px;border-radius:5px;background:var(--bg);color:var(--text-3)}
.tc-time{font-size:9px;color:var(--apricot);font-weight:600}
.tc-color{font-size:9px;padding:1px 6px;border-radius:4px;color:#fff}
/* 脚本 */
.script-card{background:var(--bg-card);border-radius:var(--radius);padding:18px 22px;box-shadow:var(--shadow);margin-bottom:14px;border:1px solid var(--border)}
.sc-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.sc-title{font-size:13px;font-weight:600;color:var(--green-deep)}
.sc-tag{font-size:9px;padding:2px 8px;border-radius:6px;background:var(--apricot-soft);color:#b07830}
.sc-sec{margin-bottom:12px}
.sc-st{font-size:10.5px;font-weight:600;color:var(--green);margin-bottom:5px;letter-spacing:.3px}
.sc-sv{font-size:12px;line-height:1.7;color:var(--text-2)}
.shot-tbl{width:100%;border-collapse:collapse;font-size:11px}
.shot-tbl th{text-align:left;padding:6px 7px;background:var(--bg);color:var(--text-3);font-weight:600;border-bottom:1px solid var(--border);font-size:10px}
.shot-tbl td{padding:7px;border-bottom:1px solid var(--border);vertical-align:top;line-height:1.4}
.shot-tbl td:first-child{white-space:nowrap;color:var(--green);font-weight:600;font-size:10px}
/* 英语数据卡 */
.en-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.en-stat{background:var(--bg-card);border-radius:var(--radius);padding:14px;text-align:center;box-shadow:var(--shadow);border:1px solid var(--border)}
.en-stat .val{font-size:22px;font-weight:700;color:var(--green-deep)}
.en-stat .lbl{font-size:10px;color:var(--text-3);margin-top:3px}
.en-btns{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.en-card{background:var(--bg-card);border-radius:var(--radius);padding:20px;text-align:center;box-shadow:var(--shadow);border:1px solid var(--border)}
.en-sentence{font-size:18px;font-weight:500;color:var(--text);line-height:1.5;margin-bottom:5px}
.en-trans{font-size:12px;color:var(--text-2);margin-bottom:14px}
.en-words{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
.en-word{font-size:10.5px;padding:3px 9px;border-radius:10px;background:var(--apricot-soft);color:#b07830}
.tts-btn{padding:9px 22px;background:var(--green);color:#fff;border:none;border-radius:18px;font-size:12.5px;cursor:pointer;transition:all .15s}
.tts-btn:hover{background:var(--green-deep)}
.tts-btn:disabled{opacity:.5}
.ck-btn{padding:7px 18px;border:1px solid var(--green);color:var(--green-deep);background:transparent;border-radius:16px;font-size:11.5px;cursor:pointer;transition:all .15s;margin-top:10px}
.ck-btn:hover{background:var(--green);color:#fff}.ck-btn.done{background:var(--green);color:#fff}
/* 会计倒计时 */
.exam-cd{text-align:center;padding:18px;background:var(--green-soft);border-radius:var(--radius);margin-bottom:14px}
.exam-cd .days{font-size:38px;font-weight:700;color:var(--green-deep);line-height:1}
.exam-cd .lbl{font-size:11px;color:var(--text-2);margin-top:5px}
.phase-tabs{display:flex;gap:7px;margin-bottom:14px}
.phase-tab{flex:1;padding:9px;text-align:center;border-radius:var(--radius-sm);font-size:11.5px;cursor:pointer;border:1px solid var(--border);background:var(--bg-soft);transition:all .15s}
.phase-tab.active{background:var(--green);color:#fff;border-color:var(--green)}
.phase-tab .ps{font-size:9.5px;color:var(--text-3);margin-top:2px}
.phase-tab.active .ps{color:rgba(255,255,255,.7)}
.chap-task{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
.chap-task:last-child{border-bottom:none}
.chap-dot{width:8px;height:8px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;margin-top:4px;cursor:pointer;transition:all .15s}
.chap-dot.done{background:var(--green);border-color:var(--green)}
.chap-ct{flex:1}.chap-nm{font-size:12.5px;font-weight:500}
.chap-pt{font-size:10.5px;color:var(--text-3);margin-top:2px}
.exam-point{background:var(--apricot-soft);border-radius:var(--radius-sm);padding:12px 14px;margin:10px 0}
.exam-point .ept{font-size:11px;font-weight:600;color:#b07830;margin-bottom:5px}
.exam-point .epv{font-size:12px;color:var(--text-2);line-height:1.6}
.quiz-item{background:var(--bg);border-radius:var(--radius-sm);padding:12px 14px;margin-top:8px}
.quiz-q{font-size:12px;font-weight:500;margin-bottom:5px}
.quiz-a{font-size:11.5px;color:var(--green-deep);font-style:italic;display:none;margin-top:5px;padding-top:5px;border-top:1px dashed var(--border)}
.quiz-a.show{display:block}
/* 运动 */
.sport-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.sport-card{background:var(--bg-card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);border:1px solid var(--border)}
.sport-nm{font-size:13px;font-weight:600;color:var(--green-deep);margin-bottom:8px}
.sport-link{display:block;font-size:10.5px;color:var(--green);text-decoration:none;margin-bottom:5px;padding:5px 9px;background:var(--bg);border-radius:var(--radius-sm);transition:all .12s}
.sport-link:hover{background:var(--green-soft)}
.wk-dots{display:flex;gap:5px;margin-top:8px}
.wk-dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:8px;color:var(--text-3);cursor:pointer;transition:all .15s}
.wk-dot.done{background:var(--green);border-color:var(--green);color:#fff}
.wk-dot.today{border-color:var(--apricot)}
/* 统计 */
.streak-banner{background:var(--green-soft);border-radius:var(--radius);padding:14px 18px;margin-bottom:14px;display:flex;align-items:center;gap:14px}
.streak-num{font-size:30px;font-weight:700;color:var(--green-deep)}
.streak-warn{display:none;padding:9px 13px;background:rgba(180,100,100,.06);border-radius:var(--radius-sm);font-size:11.5px;color:#a06060;margin-bottom:10px}
.streak-warn.show{display:block}
.stats-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px}
.stat-card{background:var(--bg-card);border-radius:var(--radius);padding:14px;text-align:center;box-shadow:var(--shadow);border:1px solid var(--border)}
.stat-val{font-size:20px;font-weight:700;color:var(--green-deep)}
.stat-lbl{font-size:9.5px;color:var(--text-3);margin-top:3px}
.stat-rate{font-size:9px;margin-top:4px;padding:1px 7px;border-radius:6px;display:inline-block}
.r-high{background:var(--green-soft);color:var(--green-deep)}.r-mid{background:var(--apricot-soft);color:#b07830}.r-low{background:rgba(180,100,100,.08);color:#a06060}
.mb-item{margin-bottom:8px}
.mb-lbl{font-size:11px;color:var(--text-2);margin-bottom:3px;display:flex;justify-content:space-between}
.mb-track{background:var(--bg);border-radius:20px;height:7px;overflow:hidden}
.mb-fill{height:100%;border-radius:20px;transition:width .4s}
.b-study{background:var(--green)}.b-english{background:var(--apricot)}.b-sport{background:#4a8a5a}.b-review{background:#6868a0}.b-todo{background:#a06060}
.hist-tbl{width:100%;border-collapse:collapse;font-size:11px}
.hist-tbl th{text-align:left;padding:7px;background:var(--bg);color:var(--text-3);font-weight:600;border-bottom:1px solid var(--border);font-size:10px}
.hist-tbl td{padding:7px;border-bottom:1px solid var(--border)}
.hist-tbl tr.tod-row{background:var(--green-soft)}
.c-yes{color:var(--green);font-weight:600}.c-no{color:var(--text-3)}
/* 女性故事 */
.wm-name{font-size:16px;font-weight:700;color:var(--green-deep)}
.wm-title{font-size:11.5px;color:var(--apricot);margin-bottom:10px}
.wm-story{font-size:12.5px;line-height:1.8;color:var(--text-2)}
.wm-quote{margin-top:12px;padding:11px 15px;background:var(--apricot-soft);border-radius:var(--radius-sm);font-size:12.5px;font-style:italic;border-left:3px solid var(--apricot)}
/* 日历 */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.cal-hd{text-align:center;font-size:10px;color:var(--text-3);font-weight:600;padding:5px 0}
.cal-day{aspect-ratio:1;border-radius:var(--radius-sm);border:1px solid var(--border);padding:4px;font-size:10px;cursor:pointer;transition:all .12s;display:flex;flex-direction:column;justify-content:flex-start;background:var(--bg-soft)}
.cal-day:hover{border-color:var(--green)}
.cal-day.empty{border:none;background:transparent;cursor:default}
.cal-day.today{border-color:var(--apricot);border-width:2px}
.cal-day .cd-num{font-weight:600;color:var(--text)}
.cal-day .cd-dots{display:flex;gap:2px;margin-top:2px;flex-wrap:wrap}
.cal-day .cd-dot{width:5px;height:5px;border-radius:50%}
.cal-day .cd-dot.study{background:var(--green)}.cal-day .cd-dot.english{background:var(--apricot)}.cal-day .cd-dot.sport{background:#4a8a5a}.cal-day .cd-dot.review{background:#6868a0}
.cal-day.broken{background:rgba(180,100,100,.05)}
.cal-legend{display:flex;gap:14px;margin-top:12px;font-size:10px;color:var(--text-3);flex-wrap:wrap}
.cal-legend span{display:flex;align-items:center;gap:4px}
.cal-legend .lg-dot{width:7px;height:7px;border-radius:50%}
/* 记账 */
.acct-table{width:100%;border-collapse:collapse;font-size:11.5px}
.acct-table th{text-align:left;padding:7px;background:var(--bg);color:var(--text-3);font-weight:600;border-bottom:1px solid var(--border);font-size:10px}
.acct-table td{padding:7px;border-bottom:1px solid var(--border)}
.acct-table .amt-in{color:var(--green-deep);font-weight:600}
.acct-table .amt-out{color:#a06060}
.acct-form{display:grid;grid-template-columns:1fr 1fr 1fr 1fr auto;gap:8px;margin-bottom:14px}
.acct-form input,.acct-form select{padding:7px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:11.5px;font-family:var(--font)}
.acct-form input:focus,.acct-form select:focus{outline:none;border-color:var(--green)}
.acct-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.acct-sum-card{background:var(--bg-card);border-radius:var(--radius);padding:12px;text-align:center;box-shadow:var(--shadow);border:1px solid var(--border)}
.acct-sum-val{font-size:18px;font-weight:700}
.acct-sum-lbl{font-size:9.5px;color:var(--text-3);margin-top:2px}
/* 饮食 */
.meal-card{margin-bottom:12px}
.meal-t{font-size:12px;font-weight:600;color:var(--green-deep);margin-bottom:6px}
.meal-input{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:12px;font-family:var(--font);background:var(--bg-soft);resize:vertical;min-height:50px}
.meal-input:focus{outline:none;border-color:var(--green)}
/* 复盘 */
.rv-field{margin-bottom:14px}
.rv-field label{display:block;font-size:11.5px;font-weight:600;color:var(--green-deep);margin-bottom:5px}
.rv-field textarea{width:100%;min-height:70px;padding:10px;border:1px solid var(--border);border-radius:var(--radius-sm);font-family:var(--font);font-size:12.5px;resize:vertical;background:var(--bg-soft);line-height:1.6}
.rv-field textarea:focus{outline:none;border-color:var(--green)}
/* 目标 */
.goal-card{background:var(--bg-card);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);margin-bottom:12px;border:1px solid var(--border);border-left:3px solid var(--green)}
.goal-name{font-size:13px;font-weight:600;color:var(--green-deep);margin-bottom:5px}
.goal-progress{display:flex;align-items:center;gap:10px;margin-top:8px}
.goal-bar{flex:1;background:var(--bg);border-radius:20px;height:8px;overflow:hidden}
.goal-fill{height:100%;border-radius:20px;transition:width .4s}
.goal-pct{font-size:12px;font-weight:700;color:var(--green-deep);min-width:36px;text-align:right}
.goal-detail{font-size:11px;color:var(--text-3);margin-top:5px}
/* 博客 */
.blog-card{background:var(--bg-card);border-radius:var(--radius);padding:14px 18px;box-shadow:var(--shadow);margin-bottom:10px;border:1px solid var(--border);transition:all .15s}
.blog-card:hover{border-color:var(--green)}
.blog-src{font-size:9.5px;color:var(--apricot);margin-bottom:3px}
.blog-title{font-size:13px;font-weight:600;line-height:1.5;margin-bottom:3px}
.blog-summary{font-size:11.5px;color:var(--text-2);line-height:1.6}
/* 运营知识卡 */
.op-card{background:var(--bg-card);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);margin-bottom:12px;border:1px solid var(--border)}
.op-title{font-size:13px;font-weight:600;color:var(--text);margin-bottom:6px}
.op-content{font-size:12px;color:var(--text-2);line-height:1.7}
.op-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
/* 热点 */
.hot-item{background:var(--bg);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:8px;border-left:3px solid var(--apricot)}
.hot-title{font-size:12.5px;font-weight:600;color:var(--text)}
.hot-desc{font-size:11px;color:var(--text-2);margin-top:3px}
/* 备忘录 */
.memo-area{width:100%;min-height:80px;padding:11px;border:1px solid var(--border);border-radius:var(--radius-sm);font-family:var(--font);font-size:11.5px;resize:vertical;background:var(--bg-soft);line-height:1.6}
.memo-area:focus{outline:none;border-color:var(--green)}
.hidden{display:none}
@media(max-width:768px){
  .sidebar{position:relative;width:100%;height:auto;flex-direction:row;overflow-x:auto}
  .sidebar-hd,.sidebar-ft{display:none}
  .menu{flex-direction:row;padding:0}.menu-item{white-space:nowrap;border-left:none;border-bottom:3px solid transparent;padding:10px 14px}
  .menu-item.active{border-bottom-color:var(--green)}
  .main{margin-left:0;padding:18px}
  .dash-grid,.en-stats,.stats-grid,.acct-summary{grid-template-columns:repeat(2,1fr)}
  .sport-grid{grid-template-columns:1fr}
  .acct-form{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="sidebar-hd">
      <h1>清新每一天<br>2026财务成长版</h1>
      <div class="sub" id="todayDate"></div>
    </div>
    <div class="menu" id="menuList"></div>
    <div class="sidebar-ft">每日零点自动刷新</div>
  </div>
  <div class="main" id="mainContent"></div>
</div>
<script>
/* ========== 工具 ========== */
function getTodayStr(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dateSeed(off){var d=new Date();d.setDate(d.getDate()+(off||0));return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate()}
function sRand(s){var x=Math.sin(s)*10000;return x-Math.floor(x)}
function pickFrom(arr,n,soff){var pool=arr.slice(),res=[],seed=dateSeed(soff||0);for(var i=0;i<n&&pool.length>0;i++){var idx=Math.floor(sRand(seed+i*7.3)*pool.length);res.push(pool.splice(idx,1)[0])}return res}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function debounce(fn,w){var t;return function(){var a=arguments,c=this;clearTimeout(t);t=setTimeout(function(){fn.apply(c,a)},w)}}
function rateCls(p){return p>=80?'r-high':p>=50?'r-mid':'r-low'}

/* ========== 菜单 ========== */
var MENU=[
  {id:'home',name:'首页总览'},
  {id:'plan',name:'每日待办计划'},
  {id:'goals',name:'成长项目总览'},
  {id:'diet',name:'日常饮食记录'},
  {id:'calendar',name:'月度日历打卡'},
  {id:'account',name:'个人收支记账'},
  {id:'media',name:'财税自媒体爆款库'},
  {id:'english',name:'日常口语英语学习'},
  {id:'women',name:'伟大女性故事打卡'},
  {id:'accounting',name:'中级会计单科备考'},
  {id:'sport',name:'运动打卡专区'},
  {id:'stats',name:'打卡数据统计总览'},
  {id:'blog',name:'财经博客精选推送'}
];
var curPanel='home';
function renderMenu(){var c=document.getElementById('menuList');c.innerHTML='';MENU.forEach(function(m,i){var el=document.createElement('div');el.className='menu-item'+(m.id===curPanel?' active':'');el.innerHTML='<span class="mi-num">'+(i+1)+'</span><span>'+m.name+'</span>';el.onclick=function(){switchPanel(m.id)};c.appendChild(el)})}
function switchPanel(id){curPanel=id;renderMenu();renderPanel(id);window.scrollTo(0,0)}
function renderPanel(id){var main=document.getElementById('mainContent');main.innerHTML='';var fn=renderers[id];if(fn)fn(main)}

/* ========== 面板1: 首页 ========== */
function renderHome(main){
  var html='<div class="pt">清新每一天 · 2026财务成长版</div><div class="pd">全板块快捷入口 · 点击进入对应功能</div>';
  html+='<div class="card"><div class="card-t"><span class="dot"></span>工作台总介绍</div><div style="font-size:12.5px;color:var(--text-2);line-height:1.8">这是一套专为财务女生打造的自律成长工作台，涵盖<strong style="color:var(--green-deep)">每日计划、自媒体创作、备考打卡、英语学习、运动记录、数据统计</strong>等13个核心板块。每日零点自动刷新内容，所有打卡数据本地存储，陪伴你每一天的成长。</div></div>';
  html+='<div class="card"><div class="card-t"><span class="dot"></span>全板块快捷入口</div><div class="dash-grid">';
  var icons={'plan':'📋','goals':'🎯','diet':'🥗','calendar':'📅','account':'💰','media':'🔥','english':'🗣️','women':'🌟','accounting':'📚','sport':'🏃','stats':'📊','blog':'📰'};
  var descs={'plan':'5项核心任务','goals':'4大长期目标','diet':'三餐+身体状态','calendar':'可视化打卡日历','account':'收支台账','media':'爆款榜单+选题+脚本','english':'口语+词汇+TTS','women':'每日1位女性故事','accounting':'单科27章备考','sport':'八段锦+帕梅拉','stats':'连续天数+完成率','blog':'每日3篇精选'};
  MENU.slice(1).forEach(function(m){
    html+='<div class="dash-card" onclick="switchPanel(\''+m.id+'\')"><div class="dash-icon">'+(icons[m.id]||'📌')+'</div><div class="dash-name">'+m.name+'</div><div class="dash-desc">'+(descs[m.id]||'')+'</div></div>';
  });
  html+='</div></div>';
  /* 今日概览 */
  var today=getTodayStr();
  var todoDone=0,todoTotal=5;
  var td=lsGet('fw_'+today+'_todos');
  if(td){try{var arr=JSON.parse(td);todoDone=arr.filter(function(t){return t.done}).length;todoTotal=arr.length}catch(e){}}
  var enDone=lsGet('fw_'+today+'_english_done')?1:0;
  var spDone=lsGet('fw_'+today+'_sport_done')?1:0;
  var rvDone=lsGet('fw_'+today+'_review')?1:0;
  var stDone=lsGet('fw_'+today+'_study_done')?1:0;
  var total=todoDone+enDone+spDone+rvDone+stDone;
  html+='<div class="card"><div class="card-t"><span class="dot"></span>今日打卡速览</div>';
  html+='<div style="display:flex;gap:16px;flex-wrap:wrap;font-size:12px;">';
  html+='<span>计划 '+todoDone+'/'+todoTotal+'</span>';
  html+="<span style=\"color:"+(stDone?"var(--green-deep)":"var(--text-3)")+"\">备考 "+(stDone?"✓":"○")+"</span>";
  html+="<span style=\"color:"+(enDone?"var(--green-deep)":"var(--text-3)")+"\">英语 "+(enDone?"✓":"○")+"</span>";
  html+="<span style=\"color:"+(spDone?"var(--green-deep)":"var(--text-3)")+"\">运动 "+(spDone?"✓":"○")+"</span>";
  html+="<span style=\"color:"+(rvDone?"var(--green-deep)":"var(--text-3)")+"\">复盘 "+(rvDone?"✓":"○")+"</span>";
  html+='</div><div class="pw" style="margin-top:10px"><div class="pf" style="width:'+Math.round(total/9*100)+'%"></div></div><div class="pl">今日总进度 '+Math.round(total/9*100)+'%</div></div>';
  main.innerHTML=html;
}

/* ========== 面板2: 每日计划 ========== */
var TODO_DEFS=[
  {text:'查看当日全网热点、整理自媒体选题素材',tag:'hot'},
  {text:'完成当日短视频拍摄/剪辑更新',tag:'video'},
  {text:'中级会计单科当日章节学习+刷题打卡',tag:'study'},
  {text:'日常英语口语+词汇音频跟读打卡',tag:'english'},
  {text:'本周运动打卡进度跟进',tag:'exercise'}
];
var TAG_LABELS={hot:'热点',video:'自媒体',study:'备考',english:'英语',exercise:'运动'};
function renderPlan(main){
  var today=getTodayStr();var key='fw_'+today+'_todos';
  var stored=lsGet(key);var todos;
  if(stored){try{todos=JSON.parse(stored)}catch(e){todos=genTodos()}}else{todos=genTodos();lsSet(key,JSON.stringify(todos))}
  var done=todos.filter(function(t){return t.done}).length;var pct=todos.length>0?Math.round(done/todos.length*100):0;
  main.innerHTML='<div class="pt">每日待办计划</div><div class="pd">极度精简 · 固定5项核心成长任务</div>'+
    '<div class="card"><div class="card-t"><span class="dot"></span>今日进度 '+done+'/'+todos.length+'</div><div class="pw"><div class="pf" style="width:'+pct+'%"></div></div><div class="pl">完成率 '+pct+'%</div><div style="margin-top:10px" id="todoList"></div></div>';
  var list=document.getElementById('todoList');
  todos.forEach(function(todo,idx){
    var item=document.createElement('div');item.className='todo-item'+(todo.done?' done':'');
    item.innerHTML='<div class="todo-cb'+(todo.done?' checked':'')+'"></div><div class="todo-ct"><div class="todo-tx">'+todo.text+'</div><span class="tag tg-'+todo.tag+'">'+TAG_LABELS[todo.tag]+'</span></div>';
    item.onclick=function(){todos[idx].done=!todos[idx].done;lsSet(key,JSON.stringify(todos));renderPlan(main)};
    list.appendChild(item);
  });
}
function genTodos(){return TODO_DEFS.map(function(t){return{text:t.text,tag:t.tag,done:false}})}

/* ========== 面板3: 成长目标 ========== */
var GOALS=[
  {name:'自媒体变现目标',cur:0,target:50000,unit:'元',color:'var(--green)',detail:'2026年自媒体副业收入目标5万元，含广告、课程、咨询'},
  {name:'中级通关目标',cur:0,target:27,unit:'章',color:'#6868a0',detail:'《中级会计实务》27章全部学完，9月考试通关'},
  {name:'英语流利目标',cur:0,target:365,unit:'天',color:'var(--apricot)',detail:'每日口语跟读打卡，全年365天不间断'},
  {name:'年度运动目标',cur:0,target:156,unit:'次',color:'#4a8a5a',detail:'每周3次运动，全年156次打卡'}
];
function renderGoals(main){
  /* 动态计算当前进度 */
  var now=new Date();var ym=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  /* 自媒体变现：从记账里统计副业收入 */
  var mediaIncome=0;
  for(var j=1;j<=now.getDate();j++){var ds=ym+'-'+String(j).padStart(2,'0');var ac=lsGet('fw_'+ds+'_accounts');if(ac){try{JSON.parse(ac).forEach(function(r){if(r.cat==='副业收入')mediaIncome+=parseFloat(r.amount||0)})}catch(e){}}}
  GOALS[0].cur=mediaIncome;
  /* 中级通关 */
  var chapDone=0;STUDY_CHAPTERS.forEach(function(c){if(lsGet('fw_chapter_done_'+c.name))chapDone++});
  GOALS[1].cur=chapDone;
  /* 英语打卡天数 */
  var enDays=0;for(var i=0;i<365;i++){var d=new Date();d.setDate(d.getDate()-i);var ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');if(lsGet('fw_'+ds+'_english_done'))enDays++;else break}
  GOALS[2].cur=enDays;
  /* 运动打卡次数 */
  var spDays=0;var y=now.getFullYear();for(var m=0;m<=now.getMonth();m++){var daysInM=new Date(y,m+1,0).getDate();var maxD=m===now.getMonth()?now.getDate():daysInM;for(var j=1;j<=maxD;j++){var ds=y+'-'+String(m+1).padStart(2,'0')+'-'+String(j).padStart(2,'0');if(lsGet('fw_'+ds+'_sport_done'))spDays++}}
  GOALS[3].cur=spDays;
  main.innerHTML='<div class="pt">成长项目总览</div><div class="pd">四大长期目标 · 持续追踪</div>';
  GOALS.forEach(function(g){
    var pct=Math.min(Math.round(g.cur/g.target*100),100);
    main.innerHTML+='<div class="goal-card"><div class="goal-name">'+g.name+'</div><div class="goal-detail">'+g.detail+'</div><div class="goal-progress"><div class="goal-bar"><div class="goal-fill" style="width:'+pct+'%;background:'+g.color+'"></div></div><div class="goal-pct">'+pct+'%</div></div><div style="font-size:11px;color:var(--text-3);margin-top:4px">当前 '+g.cur+' / '+g.target+' '+g.unit+'</div></div>';
  });
}

/* ========== 面板4: 饮食记录 ========== */
function renderDiet(main){
  var today=getTodayStr();
  var key='fw_'+today+'_diet';
  var data=lsGet(key);var diet={breakfast:'',lunch:'',dinner:'',snack:'',status:''};
  if(data){try{diet=JSON.parse(data)}catch(e){}}
  main.innerHTML='<div class="pt">日常饮食记录</div><div class="pd">三餐记录 · 身体状态</div><div class="card">'+
    '<div class="meal-card"><div class="meal-t">🌅 早餐</div><textarea class="meal-input" id="dietBreakfast" placeholder="记录早餐内容...">'+diet.breakfast+'</textarea></div>'+
    '<div class="meal-card"><div class="meal-t">☀️ 午餐</div><textarea class="meal-input" id="dietLunch" placeholder="记录午餐内容...">'+diet.lunch+'</textarea></div>'+
    '<div class="meal-card"><div class="meal-t">🌙 晚餐</div><textarea class="meal-input" id="dietDinner" placeholder="记录晚餐内容...">'+diet.dinner+'</textarea></div>'+
    '<div class="meal-card"><div class="meal-t">🍪 加餐/零食</div><textarea class="meal-input" id="dietSnack" placeholder="加餐记录（可选）...">'+diet.snack+'</textarea></div>'+
    '<div class="meal-card"><div class="meal-t">💭 身体状态</div><textarea class="meal-input" id="dietStatus" placeholder="今日身体感受：精力/疲劳/消化等...">'+diet.status+'</textarea></div>'+
    '<button class="btn btn-g" id="dietSave">保存记录</button> <span id="dietSaved" style="font-size:11px;color:var(--green);margin-left:8px"></span></div>';
  document.getElementById('dietSave').onclick=function(){
    var d={breakfast:val('dietBreakfast'),lunch:val('dietLunch'),dinner:val('dietDinner'),snack:val('dietSnack'),status:val('dietStatus')};
    lsSet(key,JSON.stringify(d));var el=document.getElementById('dietSaved');el.textContent='已保存 ✓';setTimeout(function(){el.textContent=''},2000);
  };
}
function val(id){var el=document.getElementById(id);return el?el.value:''}

/* ========== 面板5: 月度日历 ========== */
function renderCalendar(main){
  var now=new Date();var year=now.getFullYear();var month=now.getMonth();var today=now.getDate();
  var firstDay=new Date(year,month,1).getDay();if(firstDay===0)firstDay=7;
  var daysInMonth=new Date(year,month+1,0).getDate();
  var ym=year+'-'+String(month+1).padStart(2,'0');
  var weekdays=['一','二','三','四','五','六','日'];
  var html='<div class="pt">月度日历打卡</div><div class="pd">'+year+'年'+(month+1)+'月 · 可视化打卡记录</div><div class="card"><div class="card-t"><span class="dot"></span>本月打卡日历</div>';
  html+='<div class="cal-grid">';
  weekdays.forEach(function(w){html+='<div class="cal-hd">周'+w+'</div>'});
  for(var i=1;i<firstDay;i++){html+='<div class="cal-day empty"></div>'}
  var brokenDays=[];
  for(var d=1;d<=daysInMonth;d++){
    var ds=ym+'-'+String(d).padStart(2,'0');
    var isToday=(d===today);
    var isPast=d<today;
    var st=!!lsGet('fw_'+ds+'_study_done');
    var en=!!lsGet('fw_'+ds+'_english_done');
    var sp=!!lsGet('fw_'+ds+'_sport_done');
    var rv=!!lsGet('fw_'+ds+'_review');
    var cnt=[st,en,sp,rv].filter(function(x){return x}).length;
    var broken=isPast&&cnt<2&&d!==today;
    if(broken)brokenDays.push(d);
    html+='<div class="cal-day'+(isToday?' today':'')+(broken?' broken':'')+'" data-date="'+ds+'"><div class="cd-num">'+d+'</div><div class="cd-dots">';
    if(st)html+='<div class="cd-dot study"></div>';
    if(en)html+='<div class="cd-dot english"></div>';
    if(sp)html+='<div class="cd-dot sport"></div>';
    if(rv)html+='<div class="cd-dot review"></div>';
    html+='</div></div>';
  }
  html+='</div>';
  html+='<div class="cal-legend"><span><div class="lg-dot" style="background:var(--green)"></div>备考</span><span><div class="lg-dot" style="background:var(--apricot)"></div>英语</span><span><div class="lg-dot" style="background:#4a8a5a"></div>运动</span><span><div class="lg-dot" style="background:#6868a0"></div>复盘</span><span style="color:#a06060">⚠ 断卡日（&lt;2项）</span></div>';
  if(brokenDays.length>0){html+='<div style="margin-top:10px;font-size:11px;color:#a06060">本月断卡日期：'+brokenDays.join('、')+'日</div>'}
  html+='</div>';
  main.innerHTML=html;
}

/* ========== 面板6: 收支记账 ========== */
function renderAccount(main){
  var today=getTodayStr();
  var key='fw_'+today+'_accounts';
  var records=lsGet(key);try{records=records?JSON.parse(records):[]}catch(e){records=[]}
  var totalIn=0,totalOut=0;
  records.forEach(function(r){if(r.type==='收入')totalIn+=parseFloat(r.amount||0);else totalOut+=parseFloat(r.amount||0)});
  var balance=totalIn-totalOut;
  main.innerHTML='<div class="pt">个人收支记账</div><div class="pd">日常收支记录台账 · 今日明细</div>';
  main.innerHTML+='<div class="acct-summary"><div class="acct-sum-card"><div class="acct-sum-val" style="color:var(--green-deep)">+'+totalIn.toFixed(2)+'</div><div class="acct-sum-lbl">今日收入</div></div><div class="acct-sum-card"><div class="acct-sum-val" style="color:#a06060">-'+totalOut.toFixed(2)+'</div><div class="acct-sum-lbl">今日支出</div></div><div class="acct-sum-card"><div class="acct-sum-val" style="color:'+(balance>=0?'var(--green-deep)':'#a06060')+'">'+(balance>=0?'+':'')+balance.toFixed(2)+'</div><div class="acct-sum-lbl">今日结余</div></div></div>';
  main.innerHTML+='<div class="card"><div class="card-t"><span class="dot"></span>新增记录</div><div class="acct-form"><select id="acctType"><option value="支出">支出</option><option value="收入">收入</option></select><input type="number" id="acctAmount" placeholder="金额" step="0.01" min="0"><select id="acctCat"><option>餐饮</option><option>交通</option><option>购物</option><option>学习</option><option>生活</option><option>其他</option><option>副业收入</option><option>工资</option></select><input type="text" id="acctNote" placeholder="备注"><button class="btn btn-g" id="acctAdd">添加</button></div></div>';
  main.innerHTML+='<div class="card"><div class="card-t"><span class="dot"></span>今日明细（'+records.length+'条）</div>';
  if(records.length===0){main.innerHTML+='<div style="font-size:12px;color:var(--text-3);text-align:center;padding:16px 0">暂无记录</div>'}
  else{
    main.innerHTML+='<table class="acct-table"><tr><th>类型</th><th>金额</th><th>分类</th><th>备注</th><th>操作</th></tr>';
    records.forEach(function(r,i){

function delAcct(idx){
  var today=getTodayStr();var key='fw_'+today+'_accounts';
  var records=lsGet(key);try{records=JSON.parse(records)}catch(e){records=[]}
  records.splice(idx,1);
  lsSet(key,JSON.stringify(records));
  renderPanel('account');
}

  {theme:'热点嫁接+财务视角类',hook:'最近全网都在刷这个事——但你可能没注意到背后的财务逻辑。',fullScript:'某明星又因为税务问题翻车了，补税加罚款好几个亿。大家都在吃瓜，但如果你是做企业的、做副业的，这件事跟你有什么关系？我来拆解。第一，税务稽查现在靠大数据比对，不是人工抽查。你的银行流水、支付宝收入、开票数据全部联网，异常自动预警。第二，很多明星的问题出在"阴阳合同"和核定征收滥用上。个人收入硬包装成企业经营所得，用核定征收逃避累进税率——这条路基本堵死了。第三，对普通人的启示：不要心存侥幸。该申报就申报，该交税就交税。合规的成本远低于被查的代价。你在评论区告诉我，你觉得下一个会是谁？',subtitle:'明星税务案｜大数据稽查｜普通人能学到什么',shots:[{s:'0-3s 黄金钩子',a:'手持手机展示热搜页面（打码）',d:'手机画面停留2秒，放下手机看镜头'},{s:'3-15s 转折',a:'放下手机，正面半身',d:'语气从八卦转严肃'},{s:'15-40s 解读',a:'正面+白板（提前写好3点）',d:'边说边指白板，每点配字幕'},{s:'40-55s 总结',a:'正面近景，双手交叠',d:'语气诚恳，"合规是底线"'},{s:'55-60s 互动',a:'正面微笑，手指评论区',d:'轻松收尾，引导评论互动'}],bgm:'悬疑感开场BGM，15秒后转入沉稳叙事',cta:'评论区告诉我你的看法。关注我，用财务视角看热点。',benchmark:'对标：@张口说税、@财务小师妹 的热点解读类'},
  {theme:'中级备考打卡+自律类',hook:'备考中级第30天——今天差点不想学了。',fullScript:'今天真的很累。白天加了班，晚上回家看到桌上那本实务教材，差点直接躺下。但我想了想，已经坚持30天了，不能断。今天学的是长期股权投资这一章，说实话第一次看完全看不懂。我的方法是这样：第一遍快速过教材，不纠结细节，只标记看不懂的地方；第二遍看视频课，老师讲一遍比自己看三遍管用；第三遍直接做题，做错的地方回去翻对应知识点。今天做了15道选择题，对了11道。虽然不完美，但至少比昨天进步了。如果你也在备考，记住一句话：不要追求完美，要追求持续。今天学了就是赢。你在备考什么？评论区打卡，我们互相监督。',subtitle:'备考Day30｜长投章节｜在职学习记录',shots:[{s:'0-3s 黄金钩子',a:'侧面，手撑头，桌上摊开教材',d:'真实疲惫状态，不化妆，光线自然'},{s:'3-15s 情绪',a:'正面近景，对着镜头说话',d:'语气真实不矫情'},{s:'15-35s 方法',a:'俯拍桌面，手指教材+笔记',d:'展示三遍学习法的实际笔记'},{s:'35-50s 成果',a:'手机展示做题记录截图',d:'15道题对11道的真实截图'},{s:'50-60s CTA',a:'正面微笑，举起教材',d:'"今天学了就是赢"，号召打卡'}],bgm:'温暖钢琴BGM，节奏舒缓，营造陪伴感',cta:'评论区打卡你的备考进度，我们一起上岸。',benchmark:'对标：@备考日记、@自律的阿May 的学习打卡Vlog'},
  {theme:'女生成长+搞钱思维类',hook:'月入1万的女生和月入3万的女生，差距真的只在收入吗？',fullScript:'我发现一个很有意思的现象。我认识的女生里，月入1万的有人每年能存5万，月入3万的有人反而月光。差距在哪？不是收入，是财务认知。我总结了3个搞钱思维。第一，分清资产和负债。你花3万买个包是负债——它会贬值。你花3万学一门技能是资产——它能帮你赚回10万。第二，建立多个收入来源。工资只是一条腿，副业、投资、知识变现，腿越多走得越稳。第三，学会用杠杆。不是借钱投资，而是用时间杠杆——把同一份时间卖多次，比如做一个课程、写一篇文章。女生搞钱，第一步不是找副业，而是先升级你的财富思维。你现在有几个收入来源？评论区告诉我。',subtitle:'女生搞钱｜3个财富思维｜资产vs负债',shots:[{s:'0-3s 黄金钩子',a:'正面半身，双手抱胸',d:'提问式开场，字幕弹出两个数字对比'},{s:'3-15s 痛点',a:'侧身，手机展示购物车',d:'"买包是负债"字幕放大'},{s:'15-40s 方法',a:'正面+白板（画3个圈）',d:'边画边讲，每个圈代表一个思维'},{s:'40-50s 金句',a:'正面近景，认真看镜头',d:'"先升级思维再升级收入"，字幕加粗'},{s:'50-60s CTA',a:'微笑，手指评论区',d:'轻松收尾，引导互动'}],bgm:'轻快ins风BGM，营造知性女生氛围',cta:'评论区告诉我你有几个收入来源。关注我，一起搞钱一起成长。',benchmark:'对标：@搞钱女孩、@副业实验室 的成长类内容'},
  {theme:'职场吐槽+财务日常类',hook:'做财务最崩溃的瞬间——老板说"这个月能不能多交点税"。',fullScript:'我跟你说，做财务8年，最怕听到老板说这句话："这个月利润太高了，能不能想办法多交点税？"每次听到我血压就上来。多交税？老板你认真的吗？第一，合法节税是我们的专业能力，但你让我"想办法"——这个词很危险。第二，老板真正的意思是"把利润做低一点"，但做低利润不等于做假账。合规的做法是：该计提的费用计提足，该摊销的成本摊销掉，该享受的优惠全享受。第三，我见过太多企业为了少交税搞虚假成本，最后被稽查补税+罚款+滞纳金，省了10万赔了50万。所以每次老板说"想办法"，我就把合规方案和不合规的后果一起摆给他看。让他自己选。做财务的姐妹们，你们有没有类似的崩溃瞬间？',subtitle:'财务日常｜老板语录｜合规底线',shots:[{s:'0-3s 黄金钩子',a:'正面近景，表情无奈',d:'模仿老板说话的语气，制造反差喜感'},{s:'3-15s 崩溃',a:'双手扶额，桌上堆满凭证',d:'真实工作场景，不收拾'},{s:'15-35s 专业',a:'正面，切到严肃表情',d:'语气转专业，"合规做法是"配字幕'},{s:'35-50s 案例',a:'侧面，手持计算器',d:'"省10万赔50万"数字用红色字幕'},{s:'50-60s 互动',a:'正面微笑',d:'"财务姐妹们评论区集合"'}],bgm:'轻喜剧BGM，前半段搞笑后半段转正经',cta:'做财务的姐妹评论区集合！关注我，每天一个财务人的真实日常。',benchmark:'对标：@会计日常、@财务喵姐 的职场吐槽类'},
  {theme:'实操教程+手把手类',hook:'手把手教你3分钟搞定个税汇算清缴——能退几千块的那种。',fullScript:'又到了个税汇算清缴的时候，很多人不知道其实能退不少钱。今天手把手教你操作。第一步，打开个人所得税APP，点"综合所得年度汇算"。第二步，确认收入信息和专项附加扣除。重点来了——你有没有漏填的？子女教育每月2000、赡养老人每月2000（独生子女3000）、房贷利息每月1000、住房租金每月1500。符合条件但去年没填的，现在补上还来得及。第三步，选择计税方式。年终奖可以"单独计税"或"全部并入综合所得"。收入低的选并入更划算，收入高的选单独更划算。不确定就两种都试一下，系统会自动算。最后点提交，等着收钱就行。去年我帮朋友操作退了4200块，他激动得请我吃了顿火锅。赶紧去操作，别让钱白白溜走。',subtitle:'个税汇算｜退税实操｜专项附加扣除',shots:[{s:'0-3s 黄金钩子',a:'手机展示退税到账截图',d:'真实截图打码，"退了4200"大字字幕'},{s:'3-15s 步骤1',a:'俯拍手机操作界面',d:'分步截屏+手指指引'},{s:'15-30s 步骤2',a:'正面+手机交替',d:'重点讲专项附加扣除，字幕列金额'},{s:'30-45s 步骤3',a:'手机展示两种计税对比',d:'两种结果截图对比'},{s:'45-60s CTA',a:'正面微笑',d:'"赶紧去操作"，号召转发给家人'}],bgm:'轻快教程BGM，节奏明快不拖沓',cta:'赶紧转发给你的家人朋友，能退一笔钱。关注我，更多实用财税教程。',benchmark:'对标：@财税实操君、@税法小课堂 的教程类'},
  {theme:'女生独立+理财规划类',hook:'女生经济独立的第一步，不是赚更多钱——是管好你手里的钱。',fullScript:'很多女生觉得，等我月入3万了再开始理财。错了。理财不是有钱了才做的事，是管好手里的每一分钱。我给你一套简单的方法，就三步。第一步，把收入分成三份：50%生活必需、30%品质生活、20%强制储蓄。不管你月入5000还是5万，这个比例都适用。第二步，开三个银行账户。一个日常开销账户绑微信支付宝，一个储蓄账户不绑任何支付软件让你不轻易动它，一个投资账户放基金定投。第三步，给自己买一份基础保险。百万医疗一年300块，意外险一年150块。经济独立不是口号，是从管好第一个100块开始的。你现在有几个银行账户？评论区告诉我。',subtitle:'女生理财｜50-30-20法则｜三账户体系',shots:[{s:'0-3s 黄金钩子',a:'正面近景，手指镜头',d:'"不是赚更多钱"停顿"是管好手里的钱"'},{s:'3-15s 认知',a:'白板画饼图',d:'50-30-20比例图，边画边讲'},{s:'15-35s 方法',a:'俯拍桌面，三张银行卡',d:'真实银行卡（打码）展示三账户'},{s:'35-50s 保险',a:'手机展示保险对比',d:'"一年300块"字幕放大强调'},{s:'50-60s CTA',a:'正面微笑',d:'"从第一个100块开始"'}],bgm:'温柔女声BGM，营造知性独立感',cta:'评论区告诉我你有几个账户。关注我，做经济独立的女生。',benchmark:'对标：@她理财、@女生的理财课 的理财规划类'},
  {theme:'备考干货+学习方法类',hook:'中级会计实务15分的大题——我教你一个万能答题模板。',fullScript:'实务的综合题一般15-20分一道，很多人一看到就慌。其实它有套路。我给你一个万能答题框架：判断→定性→处理→列示。第一步，判断经济事项的类型。是投资？是收入？是资产减值？先归类。第二步，定性。适用哪个准则？用什么会计科目？第三步，做会计处理。写分录，注意借贷方向和金额。第四步，列示。在报表里怎么填？影响哪个项目？比如题目说"甲公司购入乙公司30%股权，能施加重大影响"，你马上反应：长期股权投资、权益法。初始投资成本=支付对价公允价值+直接相关费用。如果初始成本小于享有被投资方可辨认净资产公允价值份额，差额调增长投，计入营业外收入。这个模板练熟了，大题至少拿70%的分数。我把这个框架做成了思维导图，评论区扣1我发你。',subtitle:'实务综合题｜万能答题模板｜4步法',shots:[{s:'0-3s 黄金钩子',a:'手持真题试卷，指着大题',d:'试卷真实（打码），"15分"字幕标红'},{s:'3-15s 框架',a:'白板写4步法',d:'判断→定性→处理→列示，边写边讲'},{s:'15-40s 实操',a:'俯拍桌面，手写分录',d:'真实手写答题过程，配解说'},{s:'40-50s 技巧',a:'正面近景',d:'"练熟了至少拿70%"字幕加粗'},{s:'50-60s CTA',a:'手指评论区',d:'"扣1发思维导图"'}],bgm:'专注学习BGM，轻节拍不分散注意力',cta:'评论区扣1，我发你答题框架思维导图。关注我，备考路上不孤单。',benchmark:'对标：@中级通关计划、@会计岛 的备考干货类'}

var mediaSubTab='rank';
function renderMedia(main){
  main.innerHTML='<div class="pt">财税自媒体爆款库</div><div class="pd">爆款榜单 · 运营知识 · 热点选题 · 拍摄脚本</div>';
  main.innerHTML+='<div class="sub-tabs" id="mediaTabs">'+
    '<div class="sub-tab'+(mediaSubTab==='rank'?' active':'')+'" data-st="rank">今日榜单</div>'+
    '<div class="sub-tab'+(mediaSubTab==='op'?' active':'')+'" data-st="op">每日运营知识</div>'+
    '<div class="sub-tab'+(mediaSubTab==='topic'?' active':'')+'" data-st="topic">今日热点+每日选题</div></div>';
  main.innerHTML+='<div id="mediaContent"></div>';
  main.querySelectorAll('.sub-tab').forEach(function(t){t.onclick=function(){mediaSubTab=t.dataset.st;renderMedia(main)}});
  var mc=document.getElementById('mediaContent');
  if(mediaSubTab==='rank')renderRank(mc);
  else if(mediaSubTab==='op')renderOp(mc);
  else renderTopic(mc);
}
function renderRank(mc){
  var items=pickFrom(RANK_POOL,10,1);
  var catLabels={tax:'财税',hot:'热点',exam:'备考',growth:'女生成长'};
  var html='<div class="card"><div class="card-t"><span class="dot"></span>今日10条爆款视频拆解</div><ol class="rank-list">';
  items.forEach(function(it,i){
    var favKey='fw_rank_fav_'+i+'_'+getTodayStr();
    var favd=!!lsGet(favKey);
    html+='<li class="rank-item"><div class="rank-num">'+(i+1)+'</div><div class="rank-body">'+
      '<div class="rank-title">'+it.title+'</div>'+
      '<div class="rank-meta"><span class="rank-badge '+it.cat+'">'+catLabels[it.cat]+'</span><span class="rank-score">🔥 热度 '+it.score+'</span></div>'+
      '<div class="rank-reason"><strong>爆火原因：</strong>'+it.reason+'</div>'+
      '<div class="rank-reason"><strong>创作启发：</strong>'+it.insight+'</div>'+
      '<div class="rank-actions">'+
        '<button class="btn-mini link" onclick="window.open(\'https://www.douyin.com/search/'+encodeURIComponent(it.title)+'\',\'_blank\')">原链接</button>'+
        '<button class="btn-mini copy" onclick="copyRank('+i+')">复制结构</button>'+
        '<button class="btn-mini fav'+(favd?' active':'')+'" id="rankFav'+i+'" onclick="toggleFav(\'rank_fav_'+i+'\',this)">'+(favd?'已收藏':'收藏')+'</button>'+
      '</div></div></li>';
  });
  html+='</ol></div>';
  mc.innerHTML=html;
}
function copyRank(idx){
  var items=pickFrom(RANK_POOL,10,1);
  if(items[idx]){var t=items[idx];var txt=t.title+'\n爆火原因：'+t.reason+'\n创作启发：'+t.insight;navigator.clipboard&&navigator.clipboard.writeText(txt);alert('已复制爆款结构到剪贴板')}
}
function toggleFav(key,btn){
  var k='fw_'+key+'_'+getTodayStr();
  if(lsGet(k)){lsSet(k,'');btn.textContent='收藏';btn.classList.remove('active')}
  else{lsSet(k,'1');btn.textContent='已收藏';btn.classList.add('active')}
}
function renderOp(mc){
  var items=pickFrom(OP_KNOWLEDGE,3,201);
  var html='';
  items.forEach(function(op,i){
    var readKey='fw_op_read_'+i+'_'+getTodayStr();
    var readd=!!lsGet(readKey);
    html+='<div class="op-card"><div class="op-title">'+op.title+'</div><div class="op-content">'+op.content+'</div>'+
      '<div class="op-actions">'+
        '<button class="btn-mini fav" onclick="toggleFav(\'op_fav_'+i+'\',this)">收藏</button>'+
        '<button class="btn-mini '+(readd?'':'')+'" style="background:'+(readd?'var(--green)':'var(--green-soft)')+';color:'+(readd?'#fff':'var(--green-deep)')+'" id="opRead'+i+'" onclick="toggleRead('+i+',this)">'+(readd?'已读':'标记已读')+'</button>'+
        '<button class="btn-mini link" onclick="addOpNote('+i+')">笔记</button>'+
      '</div></div>';
  });
  mc.innerHTML=html;
}
function toggleRead(idx,btn){
  var k='fw_op_read_'+idx+'_'+getTodayStr();
  if(lsGet(k)){lsSet(k,'');btn.textContent='标记已读';btn.style.background='var(--green-soft)';btn.style.color='var(--green-deep)'}
  else{lsSet(k,'1');btn.textContent='已读';btn.style.background='var(--green)';btn.style.color='#fff'}
}
function addOpNote(idx){
  var k='fw_op_note_'+idx+'_'+getTodayStr();

  {name:'简·古道尔',title:'黑猩猩研究先驱',story:'简·古道尔26岁时前往坦桑尼亚贡贝溪国家公园，开始在野外观察黑猩猩。她没有大学学历，只有对动物的热爱和惊人的耐心。她花了数月时间让黑猩猩接受她的存在，最终发现了黑猩猩会制造和使用工具——这一发现颠覆了"只有人类会制造工具"的定论。她后来转型为环保活动家，每年300天在全球奔走。',quote:'每个人都很重要，每个人都能发挥作用，每个人都能带来变化。'},
  {name:'王亚平',title:'中国首位太空授课教师',story:'王亚平在2013年乘坐神舟十号进入太空，在太空中进行了中国首次太空授课，向全国6000万学生直播演示了失重条件下的物理现象。2021年，她再次执行神舟十三号任务，成为中国首位出舱活动的女航天员，并在太空驻留183天，创造了中国航天员在轨驻留时长纪录。',quote:'太空不会区分性别，它只奖赏有准备的人。'},
  {name:'梅耶·马斯克',title:'模特 · 营养学博士',story:'梅耶·马斯克在31岁时成为单亲妈妈，独自抚养三个孩子。她同时打五份工，生活艰辛却从不放弃自我成长。她在42岁时搬到加拿大重新开始，在50多岁时重返模特行业，69岁成为CoverGirl代言人，71岁登上时代广场广告牌。她的儿子埃隆·马斯克成为世界首富，但她从不依附于儿子的光环。',quote:'你不需要一个完美的开始，你只需要开始。'},
  {name:'秋瑾',title:'中国女权运动先驱',story:'秋瑾冲破封建婚姻的束缚，东渡日本留学，结识了鲁迅、徐锡麟等革命志士。她创办了《中国女报》，倡导女性解放，提出"女学不兴，种族不强"的主张。1907年她策划安庆起义失败后被捕，面对审讯她写下"秋风秋雨愁煞人"七个字，从容就义，年仅32岁。',quote:'身不得，男儿列；心却比，男儿烈。'},
  {name:'罗莎·帕克斯',title:'民权运动之母',story:'1955年12月1日，在阿拉巴马州的一辆公交车上，42岁的黑人女裁缝罗莎·帕克斯拒绝给白人乘客让座，因此被捕。这个看似简单的"不"字，点燃了美国民权运动的燎原之火。她的被捕引发了长达381天的蒙哥马利公交车抵制运动，最终导致公交种族隔离制度被废除。',quote:'我唯一疲倦的，是屈服。'},
  {name:'海伦·凯勒',title:'在黑暗中找到光明',story:'海伦·凯勒在19个月大时因病失去了视力和听力，陷入了一个无声无光的世界。在老师安妮·沙利文的帮助下，她学会了通过触觉"阅读"和"说话"。她成为第一位获得文学学士学位的盲聋人，精通多种语言，一生写了14本书，更是一位社会活动家。',quote:'世界上最美好和最美好的东西是看不见也摸不到的，它们只能用心去感受。'},
  {name:'吴仪',title:'中国铁娘子',story:'吴仪是中国改革开放后最重要的女性政治家之一。她从石油战线技术员做起，凭借出色的能力一步步走到国务院副总理的位置。在2003年非典危机中，她临危受命出任卫生部部长，以果断和透明的方式控制了疫情。在中美经贸谈判中，她以犀利和专业著称。',quote:'我从不在乎别人怎么评价我，我在乎的是我做了什么。'},
  {name:'张纯如',title:'《南京暴行》作者',story:'张纯如是一位美籍华裔作家和记者。她在研究中发现了被西方世界遗忘的南京大屠杀历史，决心让这段真相被世界知道。她花了三年时间走访幸存者、查阅档案，于1997年出版了《南京暴行：被遗忘的大屠杀》。这本书登上《纽约时报》畅销书榜，让西方世界第一次大规模关注这一历史事件。',quote:'如果你忘了历史，历史就会重演。文字是武器，真相是力量。'},
  {name:'赖斯',title:'首位非裔美国女性国务卿',story:'康多莉扎·赖斯在美国种族隔离的南方长大。小时候，她父亲告诉她："你可能吃不了这家餐厅，但你可以成为美国总统。"她没有成为总统，但成为了美国历史上第一位非裔女性国务卿。她是苏联问题专家，15岁进入大学，26岁获得博士学位，后成为斯坦福大学教授和教务长。',quote:'当你被低估时，最好的回应是用实力说话。'},
  {name:'屠洪娇',title:'中国女航天员刘洋的老师',story:'（以刘洋为原型）刘洋是中国第一位进入太空的女航天员。2012年她乘坐神舟九号飞船进入太空，在训练中经历了与男性航天员同样严酷的考验。她用实力证明：在探索宇宙这件事上，性别从来不是限制。她激励了无数中国女孩仰望星空。',quote:'太空不会因为你是女性就对你温柔以待。'},
  {name:'波什·赖斯',title:'首位非裔美国女性国务卿',story:'康多莉扎·赖斯在美国种族隔离的南方长大。她15岁进入大学，26岁获得博士学位，成为斯坦福大学教授。在布什政府中，她先后担任国家安全顾问和国务卿，是美国最有权力的女性之一。她证明了：出身和肤色不是限制，教育和准备才是通行证。',quote:'当你被低估时，最好的回应是用实力说话。'},
  {name:'弗吉尼亚·伍尔夫',title:'意识流文学先驱',story:'弗吉尼亚·伍尔夫是20世纪最重要的现代主义作家之一。她在《一间自己的房间》中提出了著名论断："一个女人要想写小说，必须有钱和一间自己的房间。"她患有严重的心理健康问题，但从未停止创作，《达洛维夫人》《到灯塔去》等作品开创了意识流文学的新纪元。',quote:'一个人能使自己成为自己，比什么都重要。'},
  {name:'安妮·弗兰克',title:'《安妮日记》作者',story:'安妮·弗兰克是一个犹太女孩，二战期间与家人躲在阿姆斯特丹一间密室中长达两年。13岁的她用日记记录了自己的恐惧、希望、成长和对世界的思考。最终她和家人被发现并送往集中营，安妮在Bergen-Belsen集中营去世，年仅15岁。但她的日记留存了下来，被翻译成60多种语言。',quote:'我仍然相信人心的善良。'},
  {name:'珍·奥斯汀',title:'英国文学巨匠',story:'简·奥斯汀生活在18世纪末的英国，那个时代女性写作被认为"不体面"。她的所有作品都是在客厅里偷偷写的，有人来就把手稿藏起来。她终身未婚，靠微薄的收入生活，41岁去世时几乎无人知晓她的作家身份。但她留下的六部小说成为英语文学的经典。',quote:'我不会让贫穷折损我的浪漫，但也不会让浪漫蒙蔽我对现实的判断。'},
  {name:'邓稼先夫人许鹿希',title:'隐忍坚守28年的科学家的妻子',story:'1958年，邓稼先告诉妻子许鹿希："我要调动工作了，不能告诉你去哪里。"从此，许鹿希独自抚养两个孩子，等待了整整28年。直到1986年，邓稼先因核辐射导致癌症晚期被接回北京，两人才重逢。28天的相聚后，邓稼先离世。许鹿希用余生整理丈夫的遗稿。',quote:'我等你28年，不是因为我不苦，是因为我知道你在做一件更重要的事。'}
];
function renderWomen(main){
  var today=getTodayStr();
  var seed=dateSeed(0);
  var idx=Math.floor(sRand(seed)*WOMEN_LIST.length);
  var w=WOMEN_LIST[idx];
  var key='fw_'+today+'_woman_thought';
  var thought=lsGet(key)||'';
  main.innerHTML='<div class="pt">伟大女性故事打卡</div><div class="pd">每日1位优秀女性 · 故事+金句+心得</div><div class="card"><div class="wm-name">'+w.name+'</div><div class="wm-title">'+w.title+'</div><div class="wm-story">'+w.story+'</div><div class="wm-quote">「'+w.quote+'」</div><div style="margin-top:14px"><label style="font-size:11.5px;font-weight:600;color:var(--green-deep);display:block;margin-bottom:5px">阅读心得打卡</label><textarea class="meal-input" id="womanThought" placeholder="写下你的感悟...（自动保存）" style="min-height:60px">'+thought+'</textarea></div></div>';
  var input=document.getElementById('womanThought');
  input.addEventListener('input',debounce(function(){lsSet(key,input.value)},500));
}

/* ========== 面板10: 中级会计 ========== */
var EXAM_DATE='2026-09-05';
var STUDY_CHAPTERS=[
  {name:'第一章 存货',points:'存货初始计量、发出计价、期末计量',examPoint:'存货可变现净值的确定：有合同按合同价，无合同按市场价。材料跌价取决于其生产的产成品是否跌价。',quiz1:'甲公司期末库存商品100件，成本80元/件，市场售价70元/件，预计销售费用5元/件。问期末存货价值？',a1:'可变现净值=70-5=65元/件，低于成本80元，应计提跌价准备=(80-65)×100=1500元。期末存货价值=6500元。',quiz2:'乙公司原材料成本50万元，可用于生产A产品。A产品成本100万元，可变现净值120万元。问原材料是否跌价？',a2:'A产品可变现净值120万>成本100万，未跌价，故原材料不计提跌价准备，按成本50万元计量。'},
  {name:'第二章 固定资产',points:'取得、折旧、后续支出、处置',examPoint:'双倍余额递减法最后两年改为直线法。年数总和法折旧率=尚可使用年限/年数总和×2。',quiz1:'设备原值100万，预计使用5年，净残值5万。双倍余额递减法第1年折旧？',a1:'年折旧率=2/5=40%。第1年折旧=100×40%=40万。注意双倍余额递减法初期不考虑残值。',quiz2:'同上设备，年数总和法第2年折旧？',a2:'年数总和=1+2+3+4+5=15。第2年折旧率=4/15。折旧额=(100-5)×4/15=25.33万。'},
  {name:'第三章 无形资产',points:'研发支出资本化/费用化、摊销、减值',examPoint:'研究阶段全部费用化，开发阶段满足条件资本化。使用寿命不确定的无形资产不摊销但每年减值测试。',quiz1:'甲公司研发新产品，研究阶段支出200万，开发阶段符合资本化条件支出300万。问无形资产入账价值？',a1:'研究阶段200万费用化计入当期损益。开发阶段300万资本化。无形资产入账价值=300万。',quiz2:'乙公司一项专利权，成本500万，使用寿命10年，已摊销3年。现发现技术更新，可收回金额200万。问减值损失？',a2:'账面价值=500-500/10×3=350万。可收回金额200万<350万，计提减值准备=350-200=150万。'},
  {name:'第四章 投资性房地产',points:'成本模式vs公允价值模式、转换',examPoint:'公允价值模式不计提折旧、不摊销，期末按公允价值调整，差额计入公允价值变动损益。',quiz1:'甲公司投资性房地产采用公允价值模式，成本1000万，年末公允价值1200万。问会计处理？',a1:'借：投资性房地产-公允价值变动 200万；贷：公允价值变动损益 200万。不计提折旧。',quiz2:'自用房地产转为投资性房地产（公允价值模式），账面价值800万，公允价值900万。问处理？',a2:'公允价值900万>账面价值800万，差额100万计入其他综合收益（防止操纵利润）。'},
  {name:'第五章 长期股权投资',points:'成本法、权益法、转换处理（重点）',examPoint:'权益法下，初始投资成本调整：成本<享有被投资方可辨认净资产公允价值份额的，差额调增长投，计入营业外收入。',quiz1:'甲公司以银行存款500万购入乙公司30%股权，能施加重大影响。乙公司可辨认净资产公允价值2000万。问初始处理？',a1:'享有份额=2000×30%=600万>成本500万，差额100万调增长投，计入营业外收入。调整后长投账面价值=600万。',quiz2:'承上题，乙公司当年实现净利润300万。问甲公司会计处理？',a2:'确认投资收益=300×30%=90万。借：长期股权投资-损益调整 90万；贷：投资收益 90万。长投账面价值=600+90=690万。'},
  {name:'第七章 资产减值',points:'可收回金额、减值测试、商誉减值',examPoint:'可收回金额=max(公允价值减去处置费用后的净额, 预计未来现金流量的现值)。资产减值损失一经确认不得转回。',quiz1:'设备账面价值500万，公允价值减处置费用420万，预计未来现金流量现值450万。问减值损失？',a1:'可收回金额=max(420,450)=450万。减值损失=500-450=50万。',quiz2:'商誉减值测试时，含商誉的资产组账面价值1000万，可收回金额800万。商誉账面价值200万。问商誉减值？',a2:'资产组减值损失=1000-800=200万。先冲减商誉200万，商誉全额减值。剩余减值0万分配给其他资产。'},
  {name:'第八章 金融资产',points:'三类分类及计量、重分类',examPoint:'以公允价值计量且其变动计入其他综合收益的金融资产（债权），处置时其他综合收益转入投资收益。',quiz1:'甲公司购入债券分类为以公允价值计量且其变动计入其他综合收益的金融资产，成本100万，年末公允价值105万。问处理？',a1:'借：其他债权投资-公允价值变动 5万；贷：其他综合收益 5万。',quiz2:'承上题，次年2月以108万出售。问处置处理？',a2:'借：银行存款108万；贷：其他债权投资-成本100万、其他债权投资-公允价值变动5万、投资收益3万。同时借：其他综合收益5万；贷：投资收益5万。'},
  {name:'第十三章 所得税',points:'递延所得税资产/负债、税率变化',examPoint:'可抵扣暂时性差异确认递延所得税资产，应纳税暂时性差异确认递延所得税负债。',quiz1:'甲公司资产账面价值600万，计税基础500万。所得税率25%。问递延所得税处理？',a1:'应纳税暂时性差异=600-500=100万。确认递延所得税负债=100×25%=25万。借：所得税费用25万；贷：递延所得税负债25万。',quiz2:'甲公司预计负债（产品质量保证）100万，税法实际发生时才允许扣除。所得税率25%。问处理？',a2:'可抵扣暂时性差异=100万。确认递延所得税资产=100×25%=25万。借：递延所得税资产25万；贷：所得税费用25万。'},
  {name:'第十八章 收入',points:'五步法模型、合同变更（重点）',examPoint:'五步法：识别合同→识别履约义务→确定交易价格→分摊交易价格→确认收入。某一时点vs某一时段确认。',quiz1:'甲公司销售商品100万，附7天无理由退货。根据历史经验退货率5%。问收入确认？',a1:'确认收入=100×(1-5%)=95万。预计负债=100×5%=5万。借：应收账款100万；贷：主营业务收入95万、预计负债5万。',quiz2:'甲公司签合同为客户装修，总价50万，预计成本35万。装修属于某一时段履约。截至年末完工40%。问收入确认？',a2:'按履约进度确认收入=50×40%=20万。成本=35×40%=14万。借：合同结算-收入结转20万；贷：主营业务收入20万。'},
  {name:'第二十一章 企业合并',points:'同一控制下/非同一控制下合并（重点）',examPoint:'同一控制下合并按账面价值处理，不产生商誉。非同一控制下按公允价值处理，差额确认为商誉。',quiz1:'甲公司以银行存款800万购入乙公司100%股权（非同控）。乙公司可辨认净资产公允价值750万。问处理？',a1:'合并成本800万>可辨认净资产公允价值750万，差额50万确认为商誉。借：长期股权投资750万、商誉50万；贷：银行存款800万。',quiz2:'甲公司以银行存款600万购入乙公司100%股权（同控）。乙公司账面价值700万。问处理？',a2:'同控下按账面价值700万确认长投。差额=700-600=100万调整资本公积。借：长期股权投资700万；贷：银行存款600万、资本公积100万。'},
  {name:'第二十二章 合并财务报表',points:'合并范围、抵销分录（重点难点）',examPoint:'母公司对子公司投资与子公司所有者权益抵销。内部交易未实现利润抵销。',quiz1:'母公司对子公司100%投资800万，子公司实收资本500万、资本公积100万、盈余公积50万、未分配利润150万。问合并抵销分录？',a1:'借：实收资本500万、资本公积100万、盈余公积50万、未分配利润150万；贷：长期股权投资800万。（净资产合计800万=投资800万，无商誉）',quiz2:'母公司销售商品给子公司，售价200万，成本150万，子公司年末尚未对外销售。问合并抵销？',a2:'内部未实现利润=200-150=50万。借：营业收入200万；贷：营业成本150万、存货50万。'},

function calcStreak(suffix){var s=0;for(var i=0;i<365;i++){var d=new Date();d.setDate(d.getDate()-i);var ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');if(lsGet('fw_'+ds+'_'+suffix))s++;else break}return s}
function calcReviewStreak(){var s=0;for(var i=0;i<365;i++){var d=new Date();d.setDate(d.getDate()-i);var ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');if(lsGet('fw_'+ds+'_review'))s++;else break}return s}
function calcMonthRate(suffix){var now=new Date();var ym=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');var done=0;for(var j=1;j<=now.getDate();j++){var ds=ym+'-'+String(j).padStart(2,'0');if(lsGet('fw_'+ds+'_'+suffix))done++}return{done:done,total:now.getDate(),pct:Math.round(done/now.getDate()*100)}}
function calcReviewRate(){var now=new Date();var ym=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');var done=0;for(var j=1;j<=now.getDate();j++){var ds=ym+'-'+String(j).padStart(2,'0');if(lsGet('fw_'+ds+'_review'))done++}return{done:done,total:now.getDate(),pct:Math.round(done/now.getDate()*100)}}

  /* todo全完成率 */

  for(var j=1;j<=now.getDate();j++){var ds=ym+'-'+String(j).padStart(2,'0');var td=lsGet('fw_'+ds+'_todos');if(td){try{var arr=JSON.parse(td);tdR.total++;if(arr.filter(function(t){return t.done}).length===arr.length)tdR.done++}catch(e){}}}

  html+='<div class="card"><div class="card-t"><span class="dot"></span>月度完成进度</div>';
  [{l:'中级会计备考',p:stR.pct,c:'b-study'},{l:'英语跟读',p:enR.pct,c:'b-english'},{l:'运动打卡',p:spR.pct,c:'b-sport'},{l:'复盘日记',p:rvR.pct,c:'b-review'},{l:'每日计划全完成',p:tdR.pct,c:'b-todo'}].forEach(function(b){

  });

  html+='<div class="card"><div class="card-t"><span class="dot"></span>近14天打卡历史</div><div style="overflow-x:auto"><table class="hist-tbl"><tr><th>日期</th><th>备考</th><th>英语</th><th>运动</th><th>复盘</th><th>计划</th></tr>';
  hist.forEach(function(h){var isToday=h.date===today;html+='<tr'+(isToday?' class="tod-row"':'')+'><td>'+h.date.slice(5)+'</td><td class="'+(h.study?'c-yes':'c-no')+'">'+(h.study?'✓':'—')+'</td><td class="'+(h.english?'c-yes':'c-no')+'">'+(h.english?'✓':'—')+'</td><td class="'+(h.sport?'c-yes':'c-no')+'">'+(h.sport?'✓':'—')+'</td><td class="'+(h.review?'c-yes':'c-no')+'">'+(h.review?'✓':'—')+'</td><td>'+(h.todo!==null?h.todo+'%':'—')+'</td></tr>'});
  html+='</table></div></div>';
  main.innerHTML=html;
}
